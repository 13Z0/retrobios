emulator: REminiscence
type: libretro
core_classification: community_fork
source: "https://github.com/libretro/REminiscence"
upstream: "https://github.com/cyxx/REminiscence"
upstream_commit: "947a4dce261aacc4f6ec0c2c90cb9d7e37712c7b"
profiled_date: "2026-03-25"
source_commit: "e6c0b0039258004f8bc377ddb88c0e931db131ce"
core_version: "0.3.6"
version_basis:
  kind: file
  path: "src/libretro.cpp"
  pattern: '#define\s+RE_VERSION\s+"([^"]+)'
display_name: "Flashback (REminiscence)"
cores:
  - reminiscence
systems:
  - flashback

notes: |
  Game engine re-implementation of Flashback (Delphine Software, 1992) by Gregory Montoir,
  ported to libretro by Stuart Carnie. Version 0.3.6 (upstream is at 0.5.5).

  The core sets need_fullpath = true and valid_extensions = "map" (src/libretro.cpp:66-67).
  retro_load_game takes the directory of the loaded .MAP file as the data root
  (src/libretro.cpp:186-188). FileSystem walks that directory and its subdirectories and
  matches names case-insensitively (src/fs.cpp:44-51, 101-119), so every file below is
  found by its name anywhere under the content directory.

  detectVersion (src/libretro.cpp:118-141) probes DEMO_UK.ABA (DOS demo), INTRO.SEQ
  (DOS CD), LEVEL1.MAP (DOS), LEVEL1.LEV (Amiga) and DEMO.LEV (Amiga demo) in that
  order. Only the DOS data is accepted (src/libretro.cpp:190-192).

  The title screen and menus are skipped (src/game.cpp:84-86), so the menu maps and
  palettes and the DEMO*.BIN input recordings of the release are never opened.

  Upstream (0.5.5) additionally supports Amiga, Macintosh, PC98 data, MIDI music,
  OGG playback, SEQ cutscenes, and widescreen modes. None of these are in the
  libretro port.

files:
  - name: "LEVEL1.MAP"
    category: game_data
    system: flashback
    load_from: content_dir
    required: true
    description: "Level 1 room map, the content file the frontend loads"
    note: "Its directory, walked recursively, becomes the data root. The probe that names the release finds it third, after DEMO_UK.ABA and INTRO.SEQ."
    source_ref: "source src/libretro.cpp:66-67, 186-192, source src/game.cpp:1854-1861, source src/staticres.cpp:424"

  - name: "DEMO_UK.ABA"
    category: game_data
    system: flashback
    load_from: content_dir
    required: false
    description: "DOS demo archive holding every file the demo reads"
    note: "Probed first. Each file is read from the archive when no loose copy exists. The demo has no TELEPORT cutscene and skips it (game.cpp:1868-1870)."
    source_ref: "source src/libretro.cpp:118-141, source src/resource.cpp:55-61, source src/resource_aba.cpp:5, 19-39"

  - name: "INTRO.SEQ"
    category: game_data
    system: flashback
    load_from: content_dir
    required: false
    description: "DOS CD video, opened as a release probe"
    note: "SEQ playback stays off: g_options is zero-initialized (game.cpp:29) and use_seq_cutscenes gates the SEQ player (game.cpp:57-59)."
    source_ref: "source src/libretro.cpp:118-141"

