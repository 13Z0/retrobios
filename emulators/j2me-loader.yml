notes: |
  MIDP/CLDC runtime for Android, package ru.playsoftware.j2meloader. A MIDlet is
  converted to Dalvik bytecode on import and runs against the javax.microedition
  classes compiled into the app, so no device firmware is read. The vendor
  extension trees (Nokia, Siemens, Samsung, Motorola, Sony Ericsson, Sprint,
  Vodafone, J-Phone, KDDI, JBlend, Mascot Capsule, Mexa) are Java sources in the
  same package. The Mascot Capsule, JBlend, Motorola, Vodafone and Mexa 3D APIs
  all delegate to one renderer in ru.woesss.j2me.micro3d.
  A fork of NaikSoftware/J2meLoader with an independent history: the 2016
  ancestor carries no assets directory and none of the loading code cited below.
  ref: app/src/main/java/ru/woesss/j2me/installer/AppInstaller.java:291,
       app/src/main/java/javax/microedition/shell/AppClassLoader.java:38

  The working directory holds converted/, configs/, templates/, data/, fs/c and
  fs/e, all written by the app, plus shaders/ and soundbanks/, created empty when
  the directory is initialized and read from. fs/c and fs/e are the JSR-75
  drives, data/ is RMS storage, converted/ holds converted.dex and res.jar per
  MIDlet. The config screen has a file list for shaders/ and soundbanks/ that
  copies the files the user picks into that directory under their display name.
  ref: app/src/main/java/ru/playsoftware/j2meloader/config/ConfigFilesActivity.java:76-83,
       app/src/main/java/ru/playsoftware/j2meloader/config/ConfigFilesActivity.java:129-141,
       app/src/main/java/ru/playsoftware/j2meloader/config/Config.java:47-61,
       app/src/main/java/ru/playsoftware/j2meloader/config/Config.java:159-165,
       app/src/main/java/ru/playsoftware/j2meloader/util/FileUtils.java:213-228

  The shader and property assets are read through ContextHolder.getAssetAsString,
  which rethrows an IOException as RuntimeException instead of degrading, so an
  absent asset ends the code path that reads it. Roboto-Regular.ttf goes through
  Typeface.createFromAsset.
  ref: app/src/main/java/javax/microedition/util/ContextHolder.java:178-193

  MIDI playback goes to the Android synthesizer unless a sound bank is selected
  per MIDlet. Manager's static initializer then tries the EAS and the
  TinySoundFont plugins with that bank and falls back to the Android synthesizer
  with a toast when neither accepts it.
  ref: app/src/main/java/javax/microedition/media/Manager.java:138-140,
       app/src/main/java/ru/woesss/j2me/mmapi/synth/SynthPluginFactory.java:36-54

  The package carries every native library for arm64-v8a, armeabi-v7a, x86 and
  x86_64. The hashes below are those of the x86_64 build, version 1.8.2-dev-1973,
  the continuous release built from source_commit.

