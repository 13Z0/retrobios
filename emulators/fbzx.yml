notes: |
  ZX Spectrum emulator for SDL by Sergio Costas. Emulates the 48K, the 128K,
  the Amstrad +2, the +2A/+3 and the Spanish 128K, with Interface 1 and
  microdrives. The GitHub tree stops at 3.9.1 plus two commits, the last one
  pointing at the project's move to GitLab. RetroPie builds this head on x86
  and the 2.11.1 tag (fc1da080a17c400d8f9fdc316cbe8c1362a371c9) elsewhere.
  2.11.1 is the C code base that 3.x rewrote in C++, and its ROM loader opens
  the same names in the same order with the same fallbacks.
  ref: src/emulator.cpp:49-160, and lines 63-195 of the tag's emulator.c

  Every ROM is opened through myfopen, which tries the relative path from the
  working directory, then under /usr/share, then under /usr/local/share.
  make install copies the ROMs the project ships to share/spectrum-roms, and
  RetroPie starts the emulator from inside $md_inst/share so the relative path
  resolves there.
  ref: src/llscreen.cpp:113-133, Makefile:30-34

  A reset loads the ROM set of the current model, read in 16 KiB pages, and a
  missing page ends the program with "Can't load file". The model is the 48K
  unless the configuration file or the machine menu picks another one, and a
  snapshot can switch it too. The Interface 1 ROM is loaded after every model
  and its absence also ends the program.
  ref: src/computer.cpp:53,186, src/emulator.cpp:68-158,308-326, src/cargador.cpp:593-599

  The +2A/+3 model tries plus3-41-0.rom to plus3-41-3.rom (ROM 4.1) first,
  then plus3-40-0.rom to plus3-40-3.rom (ROM 4.0), then the legacy names
  plus3-0.rom to plus3-3.rom. The project ships only the legacy names, holding
  the 4.0 ROM.
  ref: src/emulator.cpp:103-134

  fbzx/keymap.bmp, installed to share/fbzx, is the keyboard picture shown from
  the help menu, and its absence only shows "Keymap picture not found".
  ref: src/menus.cpp:1761, src/llscreen.cpp:486-498

