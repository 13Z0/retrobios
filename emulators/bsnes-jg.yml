emulator: bsnes-jg
type: libretro
core_classification: community_fork
source: "https://github.com/libretro/bsnes-jg"
upstream: "https://gitlab.com/jgemu/bsnes"
profiled_date: "2026-03-23"
source_commit: "4aef191fef72be539ccc07ada21c6e0a65360eb7"
upstream_commit: "53e6a7c2ec4b4220adc2f8dcb3786489bd04fe0e"
core_version: "2.1.2"
version_basis:
  kind: file
  path: "version.h"
  pattern: '#define\s+JG_VERSION\s+"([^"]+)'
display_name: "Nintendo - SNES / SFC (bsnes-jg)"
cores: [bsnes-jg, bsnes_jg]
systems:
  - nintendo-snes
  - nintendo-sgb
  - nintendo-satellaview
  - nintendo-sufami-turbo

notes: |
  Fork of bsnes v115 by Rupert Carmichael, rewritten for C++ standard library.
  Coprocessor firmware loaded from system_dir via openFileCallback.
  HLE available for DSP1/1B/2/4 and ST010 (core option bsnes_jg_coproc_preferhle).
  DSP3, ST011, ST018 require LLE firmware in all cases (no HLE path).
  CX4/HitachiDSP uses embedded static data ROM (3072 bytes), no external file.
  SGB1/SGB2 boot ROMs embedded (256 bytes each).
  BML game databases embedded as C++ string literals.

  ref: libretro/libretro.cpp:420-502 fileOpenV firmware loading callback
  ref: src/cartridge.cpp:762-837 uPD7725 (DSP1-4) LLE/HLE dispatch
  ref: src/cartridge.cpp:839-909 uPD96050 (ST010/ST011) LLE/HLE dispatch
  ref: src/cartridge.cpp:623-678 ARM6 (ST018) firmware loading
  ref: src/cartridge.cpp:680-760 HG51BS169 (HitachiDSP/CX4) embedded ROM + HLE
  ref: src/coprocessor/icd.cpp:249,260 SGB1/SGB2 boot ROMs embedded
  ref: src/cartridge.cpp:64 hitachidspStaticDataROM embedded
  ref: libretro/libretro.cpp:30-33 BML databases embedded

files:
  # uPD7725 coprocessor firmware (DSP1, DSP1B, DSP2, DSP3, DSP4)
  # HLE fallback available for DSP1/1B/2/4, not for DSP3

  - name: dsp1.program.rom
    system: nintendo-snes
    required: false
    hle_fallback: true
    source_ref: "source libretro/libretro.cpp:429, source src/cartridge.cpp:782, source src/cartridge.cpp:806-812"

  - name: dsp1.data.rom
    system: nintendo-snes
    required: false
    hle_fallback: true
    source_ref: "source libretro/libretro.cpp:432, source src/cartridge.cpp:794, source src/cartridge.cpp:806-812"

