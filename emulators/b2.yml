type: standalone + libretro
core_classification: community_fork
source: "https://github.com/zoltanvb/b2-libretro"
upstream: "https://github.com/tom-seddon/b2"
profiled_date: "2026-03-23"
source_commit: "9793f6a8040c416d147003cada29363b955b54e7"
upstream_commit: "e1c9b84a9460909d4dc2030ad1d4e050012b1910"
core_version: "v0.4"
display_name: "Acorn - BBC Micro (b2)"
cores: [b2]
systems:
  - bbc-micro-b
  - bbc-micro-bplus
  - bbc-master-128
  - bbc-master-compact

notes: |
  Libretro port by Zoltan Balogh of Tom Seddon's b2 BBC Micro emulator.
  is_experimental=true in .info.
  ref: zoltanvb/b2-libretro, tom-seddon/b2

  Standalone loads ROMs through BeebROM::GetAssetPath(), which resolves
  roms/<path> under the assets folder: assets/ beside the executable on
  Windows and Linux, ../Resources/assets on macOS. Linux then tries
  ../share/b2 when the executable sits in bin/, XDG_DATA_HOME/b2 and each
  XDG_DATA_DIRS entry. The build copies etc/roms into that folder, flattening
  acorn/, watford/ and opus/ and lowercasing M128/ and MCompact/.
  ref: src/b2/roms.cpp:9-10
  ref: src/b2/load_save.cpp:171-179, src/b2/load_save.cpp:200-284
  ref: src/b2/CMakeLists.txt:285-325

  Each configuration names one OS ROM, up to 16 sideways ROMs and an optional
  second processor OS. Default configurations: six Model B disc interfaces,
  B+, B+128, Master 128 and Master Turbo on MOS 3.20 and 3.50, B with 6502
  second processor, Master Compact on MOS 5.00, 5.10 and 5.11i, and the
  Olivetti PC 128 S on MOS I5.10C.
  ref: src/b2/BeebConfig.cpp:212-462

  Libretro port embeds all ROMs as hex arrays in src/libretro/roms.hpp.
  create_core() loads OS and sideways ROMs from static machine_types[] arrays.
  GetAssetPath() and LoadFile() are stubbed: no file I/O at runtime.
  ref: zoltanvb/b2-libretro/src/libretro/roms.hpp
  ref: src/libretro/core.cpp:275-305
  ref: src/libretro/adapters.cpp:74-78

  9 machine types: B/Acorn 1770, B/Watford DDB2, B/Watford DDB3,
  B/Opus 1770, B/Opus Challenger 256K, B/Opus Challenger 512K,
  B+, B+128, Master 128 (MOS 3.20).
  Master 3.50, Master Turbo, Master Compact not yet implemented.
  ref: src/libretro/core.h:117

