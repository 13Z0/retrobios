notes: |
  Two Android packages, closed source, sold and given away on Google Play under the
  Pizza Boy A name, reached by ES-DE through its PIZZA-BOY-GBA find rule and started
  with the game passed as the rom_uri extra: it.dbtecno.pizzaboygbapro, the paid build
  the rule names first, and it.dbtecno.pizzaboygba, the free one. Two Play distribution
  builds are read here, both carrying the source stamp: Pro 2.8.13 (versionCode 343,
  Play App Signing certificate sha256
  6b5547246e41921f25eba8abb1bc018729c4f0b8db029debbd3380a2b1ec2fe1), which supplies the
  Java and the resources, and Basic 2.3.22 (versionCode 255, an APKMirror bundle of
  22 Oct 2026 whose base and arm64-v8a splits carry a valid v2 and v3 signature by the
  developer certificate sha256
  b3ee584096acf4667bb9346daa9cce19237ef7ce95c99e9260ac89be0f7d6130, CN=Davide Berra,
  O=DBTecno, and the Play source stamp), whose arm64-v8a libpizzaboy-jni.so ships DWARF
  and an unstripped symbol table and supplies every native reference below as its own
  file and line. Every Basic reference first read on 2.3.20 falls on the same lines and
  functions in 2.3.22, with the same 0x4000 read and 744 byte replacement in mmu_init.
  Java line numbers are those of Pro 2.8.13. Two rebuilt copies of Pro 1.35.11 were rejected on
  their certificate, one signed C=debugging with no source stamp and one signed
  O=APKMODY. 69 of the 77 native methods the Pro declares are exported by the Basic
  2.3.3 core, the three BIOS entry points among them: one core, compiled per package.
  The Pro on the store is 3.9.0 and no genuine copy of it is reachable: apkcombo no
  longer resolves, APKPure answers 410 for the Pro package, APKMirror carries the Basic
  package alone, Uptodown has no page for it, apkvision stops at Basic 1.9.5, and the
  newest archive.org item, labelled Pro 2.8.14, holds no file.

  One system is emulated, Game Boy Advance: the core is built from a tree named
  pizzaboyadvance whose compilation units carry gba.c and no Game Boy core, and the
  three Game Boy Color and Super Game Boy methods the Pro still declares are among the
  eight the Basic 2.3.3 library does not export.

  The BIOS is the one file the user supplies, and it is read only while Load BIOS file
  is on, off by default. The picker and the Run BIOS animation switch, on by default,
  both depend on that box (res/xml/pref_general.xml). In the free package the same
  three preferences are declared android:enabled="false". The Basic 2.3.22 Java keeps
  the whole handoff to the core behind them, and its document picker copies the
  chosen file as it is, with no zip extraction.

  A per rom Low precision BIOS set to On clears the stored path and makes the core keep
  its own replacement, and one cartridge, checksum 0xc7d89508, forces the same at load
  time. When a real image is installed the boot animation starts execution at 0 rather
  than at the cartridge entry, and a multiplayer session exchanges the CRC32 of the file
  so that both peers run the same one. In Basic 2.3.22 a save state records the CRC32
  of the 16 KB BIOS area, and a state written under another image is refused with
  "Cannot restore stat: saved with another BIOS".

  Everything else the app opens it makes itself: boxart.db and cheat.db are created by
  their own CREATE TABLE, the default skins, the shaders and the cheat descriptors are
  raw resources unpacked at first run, and <rom>.keys is an input recording. The
  obfuscated assets are PairIP tamper protection.

files:
  - name: gba_bios.bin
    system: nintendo-gba
    required: false
    hle_fallback: true
    has_builtin: true
    agnostic: true
    size: 16384
    config_key: "bios_file"
    description: "Game Boy Advance BIOS"
    note: >-
      Chosen from any location under any name through the document picker, or, when the
      picked document is named .zip, taken from its first entry. The legacy browser
      offers .gba, .bin and .zip and writes the entry it extracts to bios.bin under the
      application directory. The absolute path is stored and handed to the library,
      which copies it into a 256 byte buffer. At load time the 16 KB BIOS area is first
      filled with a 744 byte replacement compiled into the library, then, if the path is
      set, the file is opened and up to 16384 bytes are read over it and a flag records
      that a real image is installed. Nothing about the file is examined: any read
      returning at least one byte is accepted, and no size, name or hash test exists on
      either side of the bridge. A read of zero bytes leaves the replacement in place
      and logs "Cannot read BIOS file". In Basic 2.3.22 the document picker copies the
      file into the temp directory under the name the picker reports without opening
      a zip, and the legacy browser extracts a picked zip entry under its own name to
      the uncompressed directory.
    source_ref: "Pizza Boy GBA Pro 2.8.13 SettingsActivity.java:116-140 (import), :143-183
      (preference and picker), FileDialog.java:57,72,77,846-857 (legacy browser, zip entry
      to bios.bin), Common.java:85-105 (copy to temp), :160-190 (single entry unzip),
      MainActivity.java:833,835,865 (bridge), :10936-10941 (gate and handoff),
      res/xml/pref_general.xml (defaults); Pizza Boy A Basic 2.3.22
      SettingsActivity.java:206-236, xw.java:2531-2554 (copy without zip extraction),
      yj.java:279-300 (legacy browser zip entry), h3.java:123-128 (gate and handoff),
      lt.java:76-80 (state refused), MainActivity.java:524-541 (CRC32 of the file),
      pv.java:56, :299, nu.java:173-186 (multiplayer BIOS exchange), libpizzaboy-jni.so pizza.c:931-937 (path buffer),
      :944-945 (boot flag), :637-646 (low precision BIOS), global.c:22-24, :97-99
      (defaults), mmu.c:1840-1853 (replacement, gate, read, flag), :2422-2426 (forced
      HLE), cpu.c:34-40 (boot vector), gba.c:2739-2743 (CRC32 in the save state),
      :2194-2203 (restore refused)"
