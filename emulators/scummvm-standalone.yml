emulator: "ScummVM (SDL2)"
type: standalone
core_classification: game_engine
source: "https://github.com/scummvm/scummvm"
logo: "https://raw.githubusercontent.com/scummvm/scummvm/master/icons/scummvm.svg"
profiled_date: "2026-10-24"
source_commit: "6f7b060d3f940c9dec1a33172a2c4273f86cce69"
core_version: "2026.4.1git"
display_name: "ScummVM (SDL2)"
mode: standalone
cores:
  - scummvm-sa
  - "SCUMMVMSA"
systems: [scummvm]

data_root:
  linux:
    path: "/usr/local/share/scummvm"
    source_ref: "configure:402-403, configure:7550, configure:7559, backends/platform/sdl/posix/posix.cpp:313-336, backends/platform/sdl/sdl.cpp:649-663"
    note: "DATA_PATH, ${datarootdir}/scummvm for the configured prefix, /usr/local unless --prefix names another. Searched four levels deep, then the current directory. A $SNAP or $APPDIR prefix is searched first."
  macos:
    path: "ScummVM.app/Contents/Resources"
    source_ref: "backends/platform/sdl/macosx/macosx.cpp:152-162"
    note: "The bundle's Resources folder, searched two levels deep after DATA_PATH."

notes: |
  Standalone ScummVM built with the SDL2 backend and SDL2_net, as ROCKNIX
  (scummvm-sa) and AmberELEC (SCUMMVMSA) package it. ROCKNIX builds tag
  v2026.1.0 with --enable-vkeybd and --opengl-mode=auto, or without OpenGL
  on SM8550 and SM8650 (ROCKNIX
  projects/ROCKNIX/packages/emulators/standalone/scummvm-sa/package.mk:5-28).
  AmberELEC builds commit 58f8f792 with --opengl-mode=gles2, turns the
  monkey4 engine on and deletes residualvm.zip and scummclassic.zip after
  installing (AmberELEC packages/games/emulators/scummvmsa/package.mk:11-62).
  The hashes below are those of the files at the pinned commit.

  Paths below are relative to the data directory named in data_root.
  OSystem_SDL::addSysArchivesToSearchSet adds DATA_PATH, four levels deep,
  then the current directory (backends/platform/sdl/sdl.cpp:649-663). The
  Windows build reads the same files from resources compiled into the
  executable (backends/platform/sdl/win32/win32.cpp:519-523). An extrapath
  set in scummvm.ini is added before them, and the game directory is
  searched for the running game (base/main.cpp:280-296). Every file is
  opened by name through this search set.

  make install copies DIST_FILES_THEMES, DIST_FILES_NETWORKING,
  DIST_FILES_VKEYBD, DIST_FILES_ENGINEDATA, DIST_FILES_ENGINEDATA_BIG and
  DIST_FILES_SOUNDFONTS to datadir, and the engine GLSL shaders to
  datadir/shaders when the build keeps USE_OPENGL_SHADERS
  (ports.mk:13-26, Makefile.common:400-471). The engine data list follows
  the engines configure enables, those marked yes in their
  configure.engine for a release build. cryo.dat belongs to an engine that
  is off by default. The shaders are read by the OpenGL renderers of the
  3D engines and are not listed one by one.

  The MT-32 emulator reads the CM-32L pair first, then the MT-32 pair
  (audio/softsynth/mt32.cpp:286-301). ScummVM does not ship them.
  Without them MT-32 music is not available.

  ROCKNIX copies gui/themes to /usr/config/scummvm/themes and passes
  --themepath=/usr/config/scummvm/themes (ROCKNIX
  projects/ROCKNIX/packages/emulators/standalone/scummvm-sa/package.mk:40-41,
  ROCKNIX projects/ROCKNIX/packages/emulators/standalone/scummvm-sa/scripts/start_scummvm.sh:70).

  An engine data file marked required is one whose engine refuses to start
  a game without it. Other engines and the launcher run without it.

