emulator: PPSSPP
type: standalone + libretro
core_classification: official_port
source: "https://github.com/libretro/ppsspp"
upstream: "https://github.com/hrydgard/ppsspp"
profiled_date: "2026-03-24"
source_commit: "7b4ddb426bbe9e287bb7f19b0cfaebb4ea0d41d8"
core_version: "Git"
display_name: "Sony - PlayStation Portable (PPSSPP)"
cores:
  - ppsspp
systems: [sony-psp]

pack_structure:
  libretro: "PPSSPP"

data_directories:
  - ref: ppsspp-assets
    installed_on: [batocera, emudeck, lakka, recalbox, retrobat, retrodeck, retropie]
    mode: libretro
    destination: ""
    source_ref: "libretro/libretro.cpp:537, 546, 549"

notes: |
  Full HLE emulator. No Sony firmware or BIOS required.
  All PSP kernel modules (flash0:/kd/*.prx) are reimplemented in C++.
  Libretro core loads assets from system/PPSSPP/ via VFS.
  Assets include replacement PGF fonts (18 files in flash0/font/),
  game compatibility database (compat.ini), language mapping (langregion.ini),
  and post-processing shaders (shaders/).
  flash0/ is read from system/PPSSPP/flash0/ (libretro/libretro.cpp:546).
  Without its fonts the font library holds no internal font and
  sceFontOpen returns ERROR_FONT_INVALID_PARAMETER to the game
  (Core/HLE/sceFont.cpp:805-864, 984-986), so text a game draws with the
  PSP system fonts is lost. Without ppge_atlas.zim the system dialogs are
  not drawn (Core/Util/PPGeDraw.cpp:227-230).
  Libretro fork (2020-03-18) behind upstream.
  PSP_DEFAULT_FIRMWARE = 660 (Core/ConfigValues.h:40).

files:
  - name: "ppge_atlas.zim"
    installed_on: [batocera, emudeck, lakka, recalbox, retrobat, retrodeck, retropie]
    mode: libretro
    path: "PPSSPP/ppge_atlas.zim"
    description: "PPGe dialog texture atlas for save/load dialogs, on-screen keyboard, system UI"
    required: false
    source_ref: "source Core/Util/PPGeDraw.cpp:227-228"
    note: "PanicAlert if missing. System dialogs render without graphics but core continues running. Batocera, Recalbox, Lakka, RetroPie, RetroBat, EmuDeck and RetroDECK install the assets folder where their core reads it."

  - name: "ppge_atlas.meta"
    installed_on: [batocera, emudeck, lakka, recalbox, retrobat, retrodeck, retropie]
    mode: libretro
    path: "PPSSPP/ppge_atlas.meta"
    description: "PPGe atlas metadata (glyph positions, UV coords)"
    required: false
    source_ref: "source Core/Util/PPGeDraw.cpp:235-237"
    note: "Loaded after ppge_atlas.zim. Without it, dialog UI has no glyph layout. Batocera, Recalbox, Lakka, RetroPie, RetroBat, EmuDeck and RetroDECK install the assets folder where their core reads it."

  - name: "ppge_atlas.zim"
    mode: standalone
    path: "assets/ppge_atlas.zim"
    description: "PPGe dialog texture atlas for save/load dialogs, on-screen keyboard, system UI"
    required: false
    size: 666530
    sha1: "30a33f3651f8e1b0967a5dfe6ff714baebcce41a"
    bundled: true
    source_ref: "source Core/Util/PPGeDraw.cpp:227-228"
    note: "Shipped in assets/ of the PPSSPP 1.20.4 Windows zip, which the standalone reads it from."

  - name: "ppge_atlas.meta"
    mode: standalone
    path: "assets/ppge_atlas.meta"
    description: "PPGe atlas metadata (glyph positions, UV coords)"
    required: false
    size: 50242
    sha1: "ab398f667d6fd778859307c105fe16388b8fdf63"
    bundled: true
    source_ref: "source Core/Util/PPGeDraw.cpp:235-237"
    note: "Shipped in assets/ of the PPSSPP 1.20.4 Windows zip, beside ppge_atlas.zim."
