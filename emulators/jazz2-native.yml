emulator: Jazz² Resurrection
type: standalone + libretro
core_classification: game_engine
source: "https://github.com/deathkiller/jazz2-native"
upstream: "https://github.com/deathkiller/jazz2-native"
profiled_date: "2026-10-04"
source_commit: "36a1414d691142443ef7ad9078995e2be4755f11"
core_version: "3.9.0"
display_name: "Jazz Jackrabbit 2 (Jazz² Resurrection)"
cores: [jazz2]
systems: [jazz-jackrabbit-2]

notes: |
  Open-source reimplementation of Jazz Jackrabbit 2 by Dan R. The engine
  ships its own Content/ tree (animations, metadata, translations) that
  sits next to the executable in a portable copy, or under
  <prefix>/share/<package>/ once installed.
  ref: Sources/Jazz2/ContentResolver.cpp:195-247 (GetContentPath per
       platform), Sources/Jazz2/ContentResolver.cpp:455-531 (Unix layouts)

  Original Jazz Jackrabbit 2 data is read from Source/ and converted
  on first launch into the engine's own formats under Cache/: Anims.j2a
  and Data.j2d into a package, then every .j2e, .j2l and the tilesets
  the levels name. Music and cinematics are read from Source/ as they
  are.
  ref: Sources/Jazz2/ContentResolver.cpp:324-353 (GetSourcePath),
       Sources/Main.cpp:2237-2301 (RefreshCache),
       Sources/Jazz2/Compatibility/AssetConverter.cpp:332-348,
       Sources/Jazz2/Compatibility/AssetConverter.cpp:585-712

  Content/ is the engine runtime, shipped with the release package.
  Source/ holds the user's own copy of the 1998 game data. Without
  Anims.j2a (or the shareware AnimsSw.j2a) and without an existing
  cache the engine starts but is not playable. A Content/ tree prepared
  by the AssetPacker tool carries Prebaked.pak: the conversion is then
  skipped and Source/ is not read.
  ref: Sources/Main.cpp:2149-2155,
       Sources/Jazz2/ContentResolver.cpp:698-706

  On Android, Apple, Unix, UWP, Switch and Vita a Content/ directory
  next to Cache/ (next to Source/ on iOS) is searched before the shipped
  one, its .pak files first.
  ref: Sources/Jazz2/ContentResolver.cpp:708-747,
       Sources/Jazz2/ContentResolver.cpp:813-860

  The libretro build looks for Content/ next to the loaded file, in the
  core assets directory or in <system>/jazz2/, and for the original
  files in Source/ beside it, in the system directory itself or in
  <system>/jazz2/Source/.
  ref: Sources/Main.cpp:286-374

files:
  # ================================================================
  # Content/ (runtime data, shipped with each standalone release)
  # ================================================================

  - name: "Animations/"
    type: directory
    category: game_data
    path: "jazz2/Content/Animations/"
    standalone_path: "Content/Animations/"
    mode: libretro
    required: true
    source_ref: "Sources/Jazz2/ContentResolver.cpp:1352, 1482, 3165-3166"
    note: "Native graphics, sounds and the UI fonts, opened through OpenContentFile. No libretro build is published with the release, so the tree is placed by hand."

  - name: "Animations/"
    type: directory
    category: game_data
    path: "jazz2/Content/Animations/"
    standalone_path: "Content/Animations/"
    mode: standalone
    bundled: true
    required: true
    source_ref: "Sources/Jazz2/ContentResolver.cpp:1352, 1482, 3165-3166"
    note: "Native graphics, sounds and the UI fonts, opened through OpenContentFile. Shipped beside the executable in the 3.8.0 Windows and Linux zips."

  - name: "Metadata/"
    type: directory
    category: game_data
    path: "jazz2/Content/Metadata/"
    standalone_path: "Content/Metadata/"
    mode: libretro
    required: true
    source_ref: "Sources/Jazz2/ContentResolver.cpp:1099"
    note: "Actor .res descriptors (Common, Enemy, Player, UI, Boss, ...). No libretro build is published with the release, so the tree is placed by hand."

  - name: "Metadata/"
    type: directory
    category: game_data
    path: "jazz2/Content/Metadata/"
    standalone_path: "Content/Metadata/"
    mode: standalone
    bundled: true
    required: true
    source_ref: "Sources/Jazz2/ContentResolver.cpp:1099"
    note: "Actor .res descriptors (Common, Enemy, Player, UI, Boss, ...). Shipped beside the executable in the 3.8.0 Windows and Linux zips."

  - name: "Translations/"
    type: directory
    category: game_data
    path: "jazz2/Content/Translations/"
    standalone_path: "Content/Translations/"
    mode: libretro
    required: false
    source_ref: "Sources/Main.cpp:2029-2037, Sources/Jazz2/UI/Menu/LanguageSelectSection.cpp:83-95"
    note: "Language .mo bundles, searched in the user Content/Translations/ and in Cache/Translations/ first. Built-in English is used when none is loaded. No libretro build is published with the release, so the tree is placed by hand."

  - name: "Translations/"
    type: directory
    category: game_data
    path: "jazz2/Content/Translations/"
    standalone_path: "Content/Translations/"
    mode: standalone
    bundled: true
    required: false
    source_ref: "Sources/Main.cpp:2029-2037, Sources/Jazz2/UI/Menu/LanguageSelectSection.cpp:83-95"
    note: "Language .mo bundles, searched in the user Content/Translations/ and in Cache/Translations/ first. Built-in English is used when none is loaded. Shipped beside the executable in the 3.8.0 Windows and Linux zips."

