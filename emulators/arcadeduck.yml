notes: |
  DuckStation fork that runs the PlayStation based arcade boards. RetroBat
  installs the "latest" release of StillJC/ArcadeDuck unchanged: its
  ArcadeDuck.exe and resources/arcadedb.yaml are byte for byte the release
  archive arcadeduck-windows-x64-release.zip, built from 26caf9c.

  A game is a MAME style non-merged set identified by its archive name alone
  through resources/arcadedb.yaml, read from the resources folder beside the
  executable. Without that file no archive is recognised and nothing boots.
  ref: src/core/arcade/arcade_database.cpp:28, 1137-1154, 1319,
       src/core/system.cpp:1599-1616

  Arcade boots skip the PlayStation BIOS scan: each board handler loads and
  checks its own BIOS. The PS1 BIOS search inherited from DuckStation only runs
  for a standard boot, which the RetroBat launcher never requests since it
  refuses anything but a .zip set.
  ref: src/core/system.cpp:1772-1773, emulatorLauncher Generators/ArcadeDuck.Generator.cs:46-48

  Board firmware is read from the BIOS directory (EmuFolders::Bios, the
  [BIOS] SearchDirectory setting). RetroBat points it at the folder of the game
  when the firmware archive sits there, else at the RetroBat bios folder.
  ref: src/core/settings.cpp:1791, src/core/arcade/arcade_machine_handler.cpp:140-141,
       emulatorLauncher Generators/ArcadeDuck.Generator.cs:104-128

  Each member of a firmware archive is found by name, case insensitive, and
  must match the size and CRC32 listed in arcadedb.yaml, then the SHA-1 when
  one is listed. Any mismatch stops the boot.
  ref: src/core/arcade/systems/sony/zn/sony_zn.cpp:783-860,
       src/core/arcade/systems/namco/system11/namco_system11.cpp:198-240

  Konami GV uses a fixed archive name and member, hardcoded in bios.cpp rather
  than read from the database. Konami GQ takes its BIOS member 420b03.27p from
  the game archive itself, so no separate file is read for it.
  ref: src/core/bios.cpp:169-184, 233-358, 360-410,
       src/core/arcade/arcade_machine_handler.cpp:36-38, 76

  arcadedb.yaml also declares coh3002c.zip (Capcom ZN-2), sys573.zip (Konami
  System 573) and gq863.zip (Konami Twinkle), but no machine handler exists for
  those boards at this revision, so their sets never get to the point of opening
  a firmware archive.
  ref: src/core/arcade/arcade_machine_handler.cpp:952-978

  Only the members a handler reads are listed under each archive: the 512 KiB
  main BIOS and the motherboard CAT702 security key for the ZN boards, c76.bin
  for Namco System 11. The uPD78081 MCU ROM of the ZN boards is undumped and
  emulated without it.
  ref: src/core/arcade/systems/sony/zn/sony_zn.cpp:442

