emulator: "FreeIntv (Touchscreen Overlay)"
type: alias
alias_of: freeintv
core_classification: alias
source: "https://github.com/jcarr71/FreeIntvTSOverlay"
upstream: "https://github.com/libretro/FreeIntv"
profiled_date: "2026-03-22"
core_version: "1.2"
display_name: "Mattel - Intellivision (FreeIntvTSOverlay)"
cores:
  - freeintv
  - freeintvtsoverlay
systems:
  - intellivision

notes: |
  Alias of FreeIntv. The jcarr71/FreeIntvTSOverlay fork is 100% identical
  to libretro/FreeIntv (zero diff). Jason Carr's overlay work was merged
  upstream. The Makefile produces freeintv_libretro (TARGET_NAME = freeintv),
  and library_name is "freeintv" (src/libretro.c:1413).

  FreeIntvTSOverlay_libretro.info asks for 300x670 overlay PNGs in
  FreeIntvTS_Overlays, next to controller_base.png, default.png and
  button_swapscreen.png. The code reads
  <system_dir>/freeintv_overlays/<rom name>.png with a 370x600 default
  (src/libretro.c, build_overlay_path and overlay_width/overlay_height),
  decodes the controller frame and the default keypad from
  src/keypad_frame_graphic.h and src/default_keypad_image.h, and opens no
  file named button_swapscreen.png.

bios_identical_to: freeintv

data_directories:
  - ref: freeintv-overlays
    destination: freeintv_overlays
    required: false

