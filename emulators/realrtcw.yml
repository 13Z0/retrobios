    category: game_data
    system: return-to-castle-wolfenstein
    path: "main/pak0.pk3"
    required: true
    source_ref: "code/qcommon/files.c:183-185, 3927-3949, 4011-4029"
    note: "RTCW retail base. Checksum 1886207346, fatal when missing or when the checksum differs."
    unsourceable: "retail data the collection does not hold, and a same-named file of another game must not stand in"

