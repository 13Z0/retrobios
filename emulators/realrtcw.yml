notes: |
  Single-player overhaul of Return to Castle Wolfenstein built on the iortcw
  SP engine. RetroBat installs RealRTCW.x64.exe with its renderer and game
  module DLLs, which report RealRTCW 5.2, the tag dated the same day as the
  package build. emulatorlauncher runs it with fs_homepath set to roms/rtcw
  and fs_game set to the folder of the .rtcw file, and refuses to start
  unless roms/rtcw/Main holds z_zrealrtcw_ui.pk3, pak0.pk3 and
  sp_pak1.pk3 to sp_pak4.pk3
  (emulatorLauncher Generators/PortsLauncher.Configuration.cs:1362-1420).

  BASEGAME is "main" and the Windows home path is RealRTCW\5.1. On Windows the
  Steam install of RTCW (app 9010) is added as a search path, found through
  its Main\pak0.pk3.
  ref: code/qcommon/q_shared.h:58-72, code/sys/sys_win32.c:157-163

  The engine stops with a fatal error when main/pak0.pk3 is missing, or
  present with a checksum other than 1886207346. A demo pak0 under demomain/
  (checksum 2985661941) is accepted with a warning and skips the point-release
  check. Otherwise the four point-release paks are required: a missing one is
  fatal, a checksum outside the five language tables only prints a warning.
  ref: code/qcommon/files.c:180-225, code/qcommon/files.c:3782-3889,
       code/qcommon/files.c:3904-4034

  The mod's own assets ship in the RealRTCW 5.2 package as eleven further pk3
  archives in main/, which the engine loads in name order like any other pak,
  without naming or checking them. Their z_ prefixes sort them after the
  retail paks so their files win. The package also carries
  realrtcwdefault.cfg, which the engine requires, and autoexec.cfg.
  ref: code/qcommon/files.c:3241-3248, code/qcommon/files.c:3300-3340,
       code/qcommon/files.c:4364-4368,
       code/qcommon/common.c:1939-1955

