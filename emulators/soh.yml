notes: |
  PC port of The Legend of Zelda: Ocarina of Time built on the decompilation,
  by HarbourMasters. The game runs from assets extracted out of the user's
  ROM into oot.o2r (oot-mq.o2r for Master Quest), plus the port's own archive
  soh.o2r, on the libultraship runtime. ZAPDTR and OTRExporter perform the
  extraction inside the executable.

  RetroBat installs the 9.2.3 release ("Ackbar Delta"): its soh.7z carries
  the soh.exe, soh.o2r and gamecontrollerdb.txt of SoH-Ackbar-Delta-Win64.zip
  byte for byte, so the profile is pinned to the 9.2.3 tag. Its launcher
  passes the ROM on the command line when neither archive exists (only a
  .z64, .n64 or .v64 file, else it copies the ROM beside the executable), and
  deletes both archives first when the major version stored in them differs
  from the one in soh.o2r.
  ref: emulatorLauncher Generators/PortsLauncher.Configuration.cs:1685-1724

  Startup:
    1. soh.o2r is located in the application directories and its stored
       port version must match the build. A missing or outdated soh.o2r
       shows an error and exits (soh/soh/OTRGlobals.cpp:273-274, 465-483).
    2. oot.o2r and oot-mq.o2r are checked for the version they were built
       with. Without an assets/ folder beside the executable nothing can be
       regenerated and the port exits (soh/soh/OTRGlobals.cpp:397-398,
       433-443).
    3. Without either archive a ROM given on the command line is extracted.
       Otherwise .z64, .n64 and .v64 files in the search folder are offered,
       then a file dialog (soh/soh/Extractor/Extract.cpp:229-280, 488-559).

  ROM check: the size must be 32, 54 or 64 MiB, the data is converted to
  big-endian order whatever the dump format, the word at 0x10 picks the
  version from a table of known values, and a CRC-32C of the whole
  converted image must be one of 21 values, which include the debug ROM
  overdumps. Compressed files are refused. One supported ROM is needed to
  build the first archive.
  ref: soh/soh/Extractor/Extract.cpp:54-103, 335-354, 376-401

  The SHA-1 values below are those the repository publishes for the .z64
  forms of the accepted ROMs (docs/supportedHashes.json). The code itself
  only checks the CRC-32C, so .n64 and .v64 dumps of the same ROMs are
  accepted too.

  libultraship is a submodule pinned at 9.2.3 to
  fdcaf6336776d24a6408d016b0a52243f108f250. Its citations are at that
  revision.

