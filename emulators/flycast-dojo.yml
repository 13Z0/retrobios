        description: Japan
        size: 2097152
        crc32: "d4895685"
      - name: epr-21576g.ic27
        description: Japan
        size: 2097152
        crc32: "d2a1c6bf"
      - name: epr-21578h.ic27
        description: Export
        size: 2097152
        crc32: "7b452946"
