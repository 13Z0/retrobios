emulator: Flycast Dojo
type: standalone
core_classification: enhanced_fork
source: "https://github.com/blueminder/flycast-dojo"
upstream: "https://github.com/flyinghead/flycast"
source_branch: "dojo"
source_commit: "745815c929fca4a893be28c99351b44d984b6642"
upstream_commit: "f13d7ad2dcf141f59a999090dbc0f78be196e665"
logo: "https://raw.githubusercontent.com/blueminder/flycast-dojo/master/shell/linux/flycast-dojo.png"
profiled_date: "2026-10-23"
core_version: "dojo-7.8"
display_name: "Sega - Dreamcast/Naomi (Flycast Dojo)"
cores:
  - flycast-dojo
  - "flycast_dojo"
systems:
  - sega-dreamcast
  - sega-naomi
  - sega-naomi2
  - sega-atomiswave
  - sega-systemsp
mode: standalone
verification: existence

notes: |
  Fork of Flycast adding rollback and delay netplay, a lobby, spectating,
  replay recording and a training mode. The Dojo 7 releases are tagged on the
  dojo branch, which carries flyinghead/flycast up to f13d7ad of 2024-05-11
  with the Dojo commits on top. The master branch is the older Dojo 6 line.
  The build names itself with git describe, so the version string is the tag.
  ref: .github/workflows/build-and-release.yml:4-6, .github/workflows/build-and-release.yml:27

  Every file below is read from the data directory, flat, with no subfolder.
  The user data directory is <exe>/data on Windows,
  $XDG_DATA_HOME/flycast-dojo or $HOME/.local/share/flycast-dojo on Linux,
  the data/ folder of $HOME/.flycast or ~/Library/Application Support/Flycast
  on macOS, and /flycast-dojo/data on Switch. A missing file is then looked up
  in the system data directories (on Linux $XDG_DATA_DIRS or /usr/local/share
  and /usr/share, each with flycast-dojo appended, every $FLYCAST_BIOS_PATH
  entry, ./ and data/), then in the directory of the loaded game. Boot ROMs,
  flash and arcade BIOS archives are also searched in every ContentPath entry.
  ref: core/linux-dist/main.cpp:148-178, 255-296, 337-344,
  core/windows/winmain.cpp:77-97,
  shell/apple/emulator-osx/emulator-osx/osx-main.mm:108-137,
  core/stdclass.cpp:83-105, core/oslib/oslib.cpp:52-81, 88-103

  The boot ROM prefix follows the platform (core/hw/flashrom/nvmem.cpp:35-50):
    Dreamcast   -> dc_
    NAOMI       -> naomi_
    NAOMI 2     -> naomi2_
    Atomiswave  -> aw_
    System SP   -> no prefix
  Boot ROM search pattern (core/hw/flashrom/nvmem.cpp:256-272):
    {prefix}boot.bin, {prefix}boot.bin.bin, {prefix}bios.bin, {prefix}bios.bin.bin
  Flash search takes a single name, {prefix}nvmem.bin, on Dreamcast only. The
  arcade platforms keep their flash under the per-game save path, and when it
  is absent the NAOMI and Atomiswave defaults compiled into the binary are
  used for the games that have one (core/hw/flashrom/nvmem.cpp:214-254).
  The aw_ prefix never reaches a filename: the boot ROM search is skipped on
  Atomiswave, whose BIOS comes from awbios.zip.

  Arcade BIOS archives are opened as <name>.zip, then <name>.7z
  (core/hw/naomi/naomi_cart.cpp:57-75). Each ROM is looked up by CRC32 in
  the game archive, its parent and the BIOS archive, then by file name in
  the same order, and the blob of the configured region is taken, else the
  first one listed. awbios declares no CRC32, so its member is found by name.
  No hash is checked on an archive. A game with no bios field reads naomi.zip
  and runs from the flat naomi_boot.bin when the archive is missing. A game
  that names a BIOS aborts without it (core/hw/naomi/naomi_cart.cpp:190-206).

  NAOMI 2 and System SP are platforms of their own: naomi_cart_GetPlatform
  returns DC_PLATFORM_NAOMI2 for a game whose bios field is naomi2 and
  DC_PLATFORM_SYSTEMSP for segasp (core/hw/naomi/naomi_cart.cpp:785-806).

  UseReios defaults to on, so the Dreamcast boots through reios and reads
  dc_boot.bin only when HLE BIOS is turned off, to start the BIOS menu
  without a disc, or for the product ids that force the real BIOS
  (core/cfg/option.cpp:127, core/emulator.cpp:262-279, 502-526).

  The release archives hold the binary and its libraries alone. The default
  arcade flash images, the on-screen button sheet and the reios font are
  compiled in as resources.
  ref: CMakeLists.txt:966-1001, .github/workflows/build-and-release.yml:56,
  .github/workflows/build-and-release.yml:71-72

  Also read but never user supplied: buttons.png overrides the compiled in
  button sheet (core/rend/osd.cpp:155-174), mappings/*.cfg are written by the
  input configuration screen (core/input/mapping.cpp:401, 461-463),
  flycast.lua is a user script (core/lua/lua.cpp:750-760), and the training
  mode runs training/cvs2.lua or training/mvsc2.lua from the config directory
  for those two games, otherwise training/<game>.lua from the data directory
  (core/dojo/dojo.cpp:287-319).

files:
  # -------------------------------------------------------
  # Sega Dreamcast
  # -------------------------------------------------------
  - name: dc_boot.bin
    aliases: ["dc_boot.bin.bin", "dc_bios.bin", "dc_bios.bin.bin"]
    system: sega-dreamcast
    required: false
    hle_fallback: true
    min_size: 2097152
    validation: [size]
    note: "Boot ROM. reios runs by default and when it is absent. Read when HLE BIOS is off, for the product ids that force the real BIOS, and to boot the BIOS menu without a disc, which fails without it. Read fails below 2 MB."
    source_ref: "source core/hw/flashrom/nvmem.cpp:256-272, source core/emulator.cpp:502-526, source core/hw/flashrom/flashrom.cpp:21-33"

  - name: dc_nvmem.bin
    system: sega-dreamcast
    required: false
    min_size: 131072
    validation: [size]
    note: "Flash memory. Created and filled with factory settings when absent, and written back under this name."
    source_ref: "source core/hw/flashrom/nvmem.cpp:214-222, source core/hw/flashrom/nvmem.cpp:120-197, source core/hw/flashrom/nvmem.cpp:274-284"

  # -------------------------------------------------------
  # Sega NAOMI
  # -------------------------------------------------------
  - name: naomi_boot.bin
    aliases: ["naomi_boot.bin.bin", "naomi_bios.bin", "naomi_bios.bin.bin"]
    system: sega-naomi
    required: false
    min_size: 2097152
    validation: [size]
    note: "Flat boot ROM. Games whose bios field is null run from it when naomi.zip is missing."
    source_ref: "source core/hw/flashrom/nvmem.cpp:256-272, source core/hw/naomi/naomi_cart.cpp:190-206"

  - name: naomi.zip
    system: sega-naomi
    required: true
    category: bios_zip
    note: "System BIOS archive. 102 game entries name it and abort without it, and the 131 entries with no bios field read it too."
    source_ref: "source core/hw/naomi/naomi_roms.cpp:83-141, source core/hw/naomi/naomi_cart.cpp:190-206"
    contents:
