  # --- WHDLoad booter files ---
  # Read from the WHDBoot directory when an .lha or .lzh archive is launched.
  # Libretro: on first start the core copies a whdboot tree into
  # <save>/WHDBoot, taking it from system/whdboot, system/amiberry/whdboot,
  # system/Amiberry/whdboot or system itself. A candidate is used only when it
  # holds WHDLoad, JST, AmiQuit, boot-data.zip or boot-data/, the game
  # database, and the five RTB files the seed check names.
  # Standalone: the Linux, macOS and Windows installs ship the tree, and it is
  # copied into the user WHDBoot directory the same way.
  # Both builds then replace game-data/whdload_db.json with the one at the
  # first candidate when its "generated" field is later, keeping the old file
  # as a backup.
  # ref: src/osdep/amiberry.cpp:11801-11826, 12145-12179, 12205-12219,
  #      src/osdep/amiberry.cpp:12221-12287, 12289-12385,
  #      libretro/libretro.cpp:1459-1475, cmake/linux/install.cmake:196-198

  - name: "WHDLoad"
