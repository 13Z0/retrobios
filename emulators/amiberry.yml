  # --- Kickstart ROMs found by the standalone ROM scan ---
  # The scan opens every file under the ROM path whose extension is rom, bin,
  # a1000, a500, a600, a1200, a3000, a4000, cdtv, cd32 or roz and names it by
  # the ROM database. A model then takes the first ROM id on its list that
  # the scan found.
  # ref: src/osdep/amiberry_gui.cpp:219-242, src/osdep/amiberry_gui.cpp:276-298,
  #      src/osdep/amiberry_gui.cpp:422-457, src/rommgr.cpp:3175-3244

  - name: amiga-os-310.rom
    mode: standalone
    system: commodore-amiga
    required: false
    size: 524288
    crc32: "43b6dd22"
    sha1: "c3c481160866e60d085e436a24db3617ff60b5f9"
    found_by: content
    note: >
      Identified as KS ROM v3.1 (A4000)(Cloanto), ROM id 31, whatever the file
      is called. The A4000 model takes id 16 first and id 31 after it.
    source_ref: "source src/rommgr.cpp:203-204, source src/cfgfile.cpp:9749-9754, source src/cfgfile.cpp:9807"

  # --- AROS replacement ROMs ---
  # ref: src/memory.cpp:1925-1946 find_kickstart_replacement_directory,
  #      src/memory.cpp:1949-2030 load_kickstart_replacement
