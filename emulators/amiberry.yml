    system: commodore-amiga
    required: false
    size: 161031
    sha1: "c3ecdaf43cc554026c8ef1c440a08c81144f810b"
    md5: "6670a9571f235ec31b8bbd48fc18f428"
    note: >
      WHDLoad executable linked into C: of the boot drive the booter builds,
