    category: game_data
    system: quake3
    path: "baseq3/pak0.pk3"
    required: true
    source_ref: "source code/qcommon/files.c:179 (pak_checksums[0]=1566731103u), 2890 (per-index checksum compare), 3328-3329 (fatal without default.cfg)"
    note: "Retail Quake III Arena base pak. Engine prints a warning on checksum mismatch, does not refuse the file."
    unsourceable: "retail data the collection does not hold, and a same-named file of another game must not stand in"

