emulator: Quake 3 (Raspberry Pi)
type: standalone
core_classification: game_engine
source: "https://github.com/raspberrypi/quake3"
upstream: "https://github.com/ioquake/ioq3"
profiled_date: "2026-10-20"
source_commit: "8d89a2a3c1707bf0f75b2ea26645b872e97c0b95"
core_version: "1.35"
display_name: "Quake III Arena (Raspberry Pi port)"
cores: [quake3]
systems: [quake3]
verification: existence

notes: |
  The Raspberry Pi Foundation's ioquake3 1.35 snapshot with an OpenGL ES
  renderer for the VideoCore GPU (VERSION=1.35, Makefile:194). RetroPie
  builds it with build_rpi_raspbian.sh and installs ioquake3.arm and
  ioq3ded.arm, then links $md_inst/baseq3 to $romdir/ports/quake3.

  BASEGAME = "baseq3" (code/qcommon/q_shared.h:37). fs_basepath defaults to
  the directory of the binary (code/sys/sys_main.c:474-479, 574), and
  FS_Startup mounts baseq3 under fs_basepath and fs_homepath (~/.q3a),
  then fs_game when set (code/qcommon/files.c:2762-2773, 2785-2787).

  FS_CheckPak0 compares the pak checksum of baseq3/pak0.pk3 through
  pak8.pk3 to pak_checksums[] (code/qcommon/files.c:178-188, 2886-2910).
  This snapshot predates the Team Arena checksums: missionpack is only
  an ordinary mod directory here. A mismatch prints a warning and the pak
  stays mounted. A missing pak prints a message too, but the fatal error
  that follows is commented out (code/qcommon/files.c:2918-2943), so the
  point release paks are optional. What stops the engine is a missing
  default.cfg (code/qcommon/files.c:3328-3329), which only pak0.pk3
  carries.

  demoq3/pak0.pk3 with DEMO_PAK0_CHECKSUM is recognised and printed as a
  demo pak (code/qcommon/files.c:177, 2870-2884). RetroPie instead
  extracts its Q3DemoPaks.zip, the demo pak0.pk3 with the 1.32 point
  release paks, flat into baseq3/. The demo pak then fails the pak0
  checksum with a warning and runs.

