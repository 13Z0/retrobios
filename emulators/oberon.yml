# Project Oberon RISC emulator by Peter De Wachter.
# Emulates the Oberon RISC processor designed by Niklaus Wirth.
# Bootloader (512 words) compiled into the binary from risc-boot.inc,
# loaded into ROM at 0xFFFFF800 on startup (src/risc.c:75-77,93).
# No retro_get_system_directory() call, so no files from system dir.
# Content: .dsk disk images loaded via retro_load_game (Libretro/libretro.c:219-227),
# opened read-write through the frontend VFS when one is offered
# (Libretro/libretro.c:149-162, src/disk.c:13-65).
# risc.c is identical upstream. disk.c differs only by that VFS file layer.

files: []

notes:
  boot_process: >
    Bootloader embedded in ROM reads boot sector from SPI disk, loads
    Oberon inner core into RAM. Content is raw sector .dsk images.
