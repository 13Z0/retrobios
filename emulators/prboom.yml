emulator: PrBoom
type: libretro
core_classification: game_engine
source: "https://github.com/libretro/libretro-prboom"
upstream: "http://prboom.sourceforge.net/"
profiled_date: "2026-10-23"
source_commit: "4849268e7342494193f2bbf2d0128a751cf58da7"
core_version: "v2.5.0"
display_name: "Doom (PrBoom)"
cores: [prboom]
systems: [doom, heretic]

notes: |
  PrBoom is a Doom source port based on MBF (Marine's Best Friend), itself
  derived from Boom. The libretro port plays Doom, Doom II, Final Doom,
  FreeDoom, Heretic, and custom WADs/PWADs.

  prboom.wad, the engine data WAD (font glyphs, palette, colormaps,
  sine/tangent tables, gamma tables, menu graphics), is compiled into the
  core from src/prboom_wad_data.h, 143312 bytes, the same bytes as the
  prboom.wad at the repository root (md5 72ae1b47820fcc93cc0df9c428d0face).
  D_DoomMainSetup adds it as an embedded WAD after the IWAD and never opens
  prboom.wad on disk (src/d_main.c:1449-1465).

  Content is a .wad, .iwad, .pwad, .lmp, .m3u, .pk3, .ipk3 or .zip file
  (libretro/libretro.c:1029). An IWAD is passed as -iwad and needs nothing
  else (libretro/libretro.c:2621-2625). A PWAD with map markers, or a PK3,
  is paired with an IWAD of the matching generation searched next to the
  content, then in system/prboom/, then in system/ (find_iwad_for_kind,
  libretro/libretro.c:2202-2266, 2647-2693, 2733-2754). A PK3 also loads
  gzdoom.pk3, or else zdoom.pk3, from the same places before the mod
  (find_base_resource, libretro/libretro.c:2274-2305, 2756-2790). When no
  IWAD is paired, FindIWADFile tries the standard_iwads list through
  I_FindFile and the core stops with "IWAD not found" if none is found
  (src/d_main.c:146-158, src/d_main.c:1020-1038, src/d_main.c:1123-1124).
  File names are matched case-insensitively (libretro/libretro.c:787-836).

  I_FindFile search order (libretro/libretro.c:4332-4413). A name that is
  absolute or contains a folder separator is first tried as given:
  1. WAD directory (same folder as the loaded content)
  2. system/prboom/ subdirectory
  3. system/ directory directly
  4. Parent folders of the WAD directory (recursive, if enabled)

  A baseconfig is read from <content>.prboom.cfg beside the content, else
  prboom.cfg through I_FindFile (libretro/libretro.c:2594-2599,
  libretro/libretro.c:2811-2816).

