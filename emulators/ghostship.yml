notes: |
  PC port of Super Mario 64 built on the decompilation, by HarbourMasters.
  The game runs from assets extracted out of the user's N64 ROM into
  sm64.o2r, plus the port's own archive ghostship.o2r, on the libultraship
  runtime. Torch (submodule Torch) performs the extraction inside the
  executable.

  RetroBat installs the 3.0.0 release: its ghostship.7z carries the
  Ghostship.exe, ghostship.o2r, config.yml, gamecontrollerdb.txt and
  assets/ymls tree of Nautilus-Alfa-Win64.zip byte for byte, so the profile
  is pinned to the 3.0.0 tag. Its launcher passes the ROM on the command line
  when sm64.o2r is absent (only a .z64 file), and deletes sm64.o2r first
  when the portVersion inside it names another major.minor than the
  executable, so the archive is regenerated from the ROM.

  Startup:
    1. ghostship.o2r is located in the application directories and handed to
       the resource manager (src/port/Engine.cpp:229-230, 250-255).
    2. RunExtract checks sm64.o2r. It is regenerated when its portVersion
       differs from the build in major or minor, or when its version file
       holds neither ROM revision (src/port/Engine.cpp:673-682, 170-192).
    3. Without sm64.o2r a ROM given on the command line is extracted.
       Otherwise .z64 files next to the executable are offered, then a file
       dialog filtered on *.z64. A file whose SHA-1 is not in mGameList is
       refused, and with no sm64.o2r at the end the port shows an error and
       exits (src/port/GameExtractor.cpp:37-40, 114, src/port/Engine.cpp:1056-1088).
    4. LoadResourceFiles adds sm64.o2r, then every .otr, .o2r and .zip under
       mods/ and every directory there (src/port/Engine.cpp:488-518).

  The ROM SHA-1 is computed by Torch over the whole file with no byte order
  conversion, so only big-endian .z64 dumps match
  (Torch src/n64/Cartridge.cpp:21, Torch src/Companion.cpp:2491-2493). Torch then
  reads config.yml from the application bundle path, which maps each
  accepted hash to an asset tree under assets/ymls/ and to sm64.o2r. Without
  config.yml Torch logs "No config file found" and writes nothing
  (src/port/GameExtractor.cpp:295-299, Torch src/Companion.cpp:1350-1354).
  config.yml and the 842 assets/ymls files ship with the release.

  The renderer loads its shader from the archives and aborts when it is
  missing (libultraship src/fast/backends/gfx_direct3d11.cpp:1586-1598).
  The shaders are only in ghostship.o2r, packed from port/ by "torch pack port
  ghostship.o2r o2r" (CMakeLists.txt:990-996).

  tcc.dll and the .tcc tree serve the script mod compiler, and
  shaderc_shared.dll the Vulkan shader compiler. Both are program components
  of the release.

  Torch and libultraship are submodules of the repository, pinned at 3.0.0
  to 106621f0f0f9731b8739bec95227c2c5887492df and
  6b861a64d29d9fe95d100be228eb6d190231cc0d. Their citations above are at
  those revisions.

