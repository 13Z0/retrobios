emulator: DeSmuME
type: libretro
core_classification: community_fork
source: "https://github.com/libretro/desmume"
upstream: "https://github.com/TASEmulators/desmume"
profiled_date: "2026-03-23"
source_commit: "95b4d798731caa809125b6c3c11d17cc332ff6ef"
upstream_commit: "e06d11f6df8c2e35d570412c45f5a63e5e7c031d"
core_version: "SVN"
display_name: "Nintendo - DS (DeSmuME)"
cores: [desmume]
systems: [nintendo-ds]

notes: |
  Full HLE of ARM7/ARM9 SWI routines, so BIOS files are optional for most games.
  External BIOS enables SWI-from-BIOS mode. Firmware boot requires both
  BIOS files loaded and interpreter mode (JIT incompatible).
  No DSi support. Core option: desmume_use_external_bios.

files:
  - name: "bios7.bin"
    system: nintendo-ds
    description: "ARM7 BIOS"
    required: false
    hle_fallback: true
    size: 16384
    validation: [size]
    source_ref: "source desmume/src/NDSSystem.cpp:2156-2166, source desmume/src/frontend/libretro/libretro.cpp:763"
    note: "Native file needed for firmware boot and SWI-from-BIOS accuracy"

  - name: "bios9.bin"
    system: nintendo-ds
    description: "ARM9 BIOS"
    required: false
    hle_fallback: true
    size: 4096
    validation: [size]
    source_ref: "source desmume/src/NDSSystem.cpp:2214-2224, source desmume/src/frontend/libretro/libretro.cpp:764"
    note: "Native file needed for firmware boot and logo comparison (Pal Park)"

  - name: "firmware.bin"
    system: nintendo-ds
    description: "NDS firmware image"
    required: false
    hle_fallback: true
    source_ref: "source desmume/src/firmware.cpp:249-280, source desmume/src/frontend/libretro/libretro.cpp:765"
    note: "Loaded only if both BIOS files present. Needed for boot animation, wifi config, user settings"
