notes: >
  Quake engine source port by Kevin Shanahan (Tyrann). Plays Quake (id1), mission
  packs Scourge of Armagon (hipnotic) and Dissolution of Eternity (rogue), the Quoth
  mod, and custom mods. Content is a PAK file. When its path contains id1,
  hipnotic, rogue or quoth, the parent of the PAK's directory becomes basedir and
  the matching -rogue, -hipnotic or -quoth switch is set. Any other directory is
  passed as -game <dir> with its parent as basedir (common/libretro.c:1313-1325,
  common/libretro.c:1331, common/libretro.c:1363-1390). COM_InitFilesystem always
  adds basedir/id1 first, then rogue, hipnotic or quoth, then the -game directory
  (common/common.c:1717-1734), so every game reads id1/pak0.pak beside its own
  folder. COM_AddGameDirectory opens pak0.pak, pak1.pak and so on, lowercase then
  uppercase, and stops at the first index that opens neither
  (common/common.c:1668-1686). gfx.wad, gfx/palette.lmp and gfx/colormap.lmp come
  from those PAKs and a missing one stops the engine with Sys_Error
  (common/host.c:711-712, common/host.c:728-760, common/wad.c:78-81).
  gfx/pop.lmp, present only in the registered id1/pak1.pak, sets the registered
  cvar (common/common.c:938-953). The PAK directory is compared to the id1/pak0.pak
  file count and CRC, but com_modified is never read, so any PAK is accepted
  (common/common.c:1580-1593). The core never calls
  RETRO_ENVIRONMENT_GET_SYSTEM_DIRECTORY. Background music is streamed from
  music/trackNN.<ext> in each game directory, ogg, opus, mp3, flac, wav, it, s3m,
  xm or mod, when present (common/bgmusic.c:35, common/bgmusic.c:63-71,
  common/bgmusic.c:314-338).

