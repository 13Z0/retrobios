notes: |
  Closed source Amstrad CPC and PLUS emulator for Windows. The build read here
  is the one RetroBat installs, capriceforever.7z sha256
  54c9f7f3df96011bdbd09e72413fed798a395c241e8c2d05eb6af075a15b79b4, release
  26.4 of 1 April 2026 (History.txt, version resource 26.4.0.0). Caprice.exe
  md5 a33e841c80e9fd9067a1c373492cd53b is a 32-bit Delphi program, cited by
  file offset.

  The machine ROMs are compiled into the executable as named defaults. The
  464, 664 and 6128 OS and BASIC, AMSDOS and the Multiface Two ROM sit in the
  data section byte for byte equal to the usual dumps (os464.rom at 0x7f5348,
  basic464.rom at 0x7f9348, os6128.rom at 0x80d348, basic6128.rom at 0x811348,
  os664.rom at 0x815348, basic664.rom at 0x819348, amsdos.rom at 0x7e1348,
  the first 8 KiB of MF2.rom at 0x821348). A slot left blank in a device file
  takes the built-in image, and the names "Default OS", "Default BASIC",
  "Default AMSDOS", "Default Multiface Two", "Default Silicon Disc 1.3" and
  "Default DK'Tronics Speech" select them explicitly.
  ref: Caprice.exe 0x75d82c, 0x7314ad, 0x75d864, 0x75d884, 0x75d8a0

  RetroBat writes Device.ini on every launch: CPC_6128_UK, or PLUS_6128_UK for
  the gx4000 system, LowerROM and UpperROM0 blank, UpperROM7 "Default
  AMSDOS", UpperROM1 a built-in Silicon Disc or DK'Tronics image or Empty, and
  CartridgeFilename the launched .cpr. No slot it writes names a file, so
  nothing outside the program is read for a RetroBat launch.
  ref: emulatorLauncher Generators/CapriceForever.Generator.cs:277-405

  Files in Roms\ (16512 bytes, a 128 byte AMSDOS header then the 16 KiB
  image) are offered by name for the lower and upper ROM slots, and .cpr
  files in Cartridges\ for the cartridge port. The package ships four ROMs
  and three PLUS system cartridges there. Only the bundled device template
  "PLUS 6128 UK.ini" names one of them (the UK cartridge), and RetroBat
  replaces that choice with the launched game.
  ref: Caprice.exe 0x72fb01, 0x7332cb, 0x726d86

