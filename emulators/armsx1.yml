notes: |
  PlayStation emulator forked from psxe. The released application is the
  Android build, com.nanodata.armsx, version 0.3.6 at this revision. That
  build runs libretro SwanStation, checked out as the core/swanstation
  submodule at dd4805619bbbfc6e0d1776372cb16377088b448e and driven by an
  in-process adapter, and no longer the psxe engine. The SDL desktop, iOS,
  UWP, web and PSVita frontends in the same tree still build on psxe. The
  release tags 0.1.5 to 0.3.6 all sit on 99b3081 of the main branch, a
  2026-09-05 tree that carries none of this code. The version is the
  versionName android-compose builds.
  ref: android/app/build.gradle:72-75, SWANSTATION-DEV.md:10-19

  Android accepts a BIOS only through its importer. The setup wizard, the
  BIOS manager and its folder scan all ask getBiosInfoFromFd, which requires
  exactly 512 KB and then either the OpenBIOS signature at 0x78 or one of 25
  MD5 values taken from SwanStation's table. A recognised file is copied into
  <external files>/bios under its own name. The wizard does not leave the
  BIOS page until one is recognised.
  ref: android/app/src/main/java/kr/co/iefriends/pcsx2/NativeApp.java:1252-1262,
       android/app/src/main/java/com/armsx2/core/Ps1BiosProbe.java:16-79,
       android/app/src/main/java/com/armsx2/ui/onboarding/OnboardingViewModel.kt:183-203,
       android/app/src/main/java/com/armsx2/ui/onboarding/OnboardingViewModel.kt:250-255,
       android/app/src/main/java/com/armsx2/ui/bios/BiosManagerViewModel.kt:172-187

  Before each launch the settings store walks the BIOS folder, the search
  folder and the selected file's folder, each sorted by path, then the older
  user_bios.bin and bios.bin imports, and keeps the first 512 KB file whose
  MD5 entry names the preferred_model console, SCPH-1001 by default. It writes
  that path as [bios].resolved_file, and the adapter hands it to SwanStation
  as the BIOS path of all three regions, relative to the system directory,
  which is the folder of the selected BIOS or <external files>/bios.
  ref: android/app/src/main/java/com/armsx2/config/Ps1SettingsStore.kt:176-195,
       android/app/src/main/java/com/armsx2/core/Ps1BiosSelection.java:17-64,
       android/app/src/main/java/com/armsx2/config/Ps1Settings.kt:32-33,
       android/app/src/main/java/kr/co/iefriends/pcsx2/NativeApp.java:108-123,
       native/swanstation/runtime.cpp:243-247, native/swanstation/runtime.cpp:255

  No match leaves the path empty, and SwanStation scans the system directory
  itself: files of 512 KB, 4 MB or 0x3E66F0 bytes, the first 512 KB hashed
  against its 27-entry table, the first image of the console region returned,
  otherwise the first known image of another region. An unknown image is
  never used, and with nothing found the core boots its built-in OpenBIOS.
  The region is Auto unless console.region says pal or ntsc, and Auto follows
  the disc, NTSC-U without one.
  ref: swanstation src/core/host_interface.cpp:100-194,
       swanstation src/core/bios.cpp:28-104,
       swanstation src/core/system.cpp:592-645,
       swanstation src/core/system.cpp:677-682,
       native/swanstation/runtime.cpp:209

  The psxe frontends take [bios].override_file or -b, by default bios.bin
  under SDL_GetPrefPath("nanodata", "armsx"), when that file exists.
  Otherwise they scan [bios].search_path, bios by default, for .bin and .rom
  files and return the first whose stem normalises to preferred_model, else
  one named bios.bin, else the override path unchanged. psx_bios_load refuses
  anything but 512 KB or the 1 MB SCPH-5903 image and checks no hash.
  ref: frontend/config.c:54-57, frontend/config.c:279-352,
       frontend/config.c:1378-1399, frontend/config.c:1535-1554,
       frontend/main.cpp:2555-2561, psx/dev/bios.c:22-75

