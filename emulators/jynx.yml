notes: |
  Camputers Lynx 48K and 96K emulator for Windows by Jonathan Markland.
  RetroBat installs Jynx-Windows-64bit.exe with file version 1.0.8.0 and a PE
  link time of 2014-09-16 20:11 UTC, twenty minutes after the commit that sets
  the version to 1.0.8 (c1247f2). The v1.0.8a tag two days later only changes
  6845 port handling.

  At startup LoadROMS reads all six chip images, whichever model is selected
  (Portable/LynxEmulatorGuest.cpp:166-177). The Windows host opens each one by
  its fixed leaf name in the folder of the executable
  (ForWindows/MainForm.cpp:719-742). Load8KBChipFile accepts a file only when
  it is exactly 8192 bytes, and a missing or differently sized file throws "One
  or more of the ROM files are missing", which ends the program
  (Portable/LynxEmulatorGuest.cpp:181-209). No checksum is computed.

  The 96K third ROM is a 4 KB chip on the board (lynx9644.ic44), so the 8192
  byte lynx96-3.rom is that dump followed by 4 KB of padding.
  JynxEmulatorSettings.config is written by the program and read back,
  snapshots and TAP files are user content.

  The author's release, Jynx.for.GitHub.1.0.8.zip, holds the two executables
  and the readme without any ROM. RetroBat's jynx.7z package adds the six
  ROM images beside the executables.

