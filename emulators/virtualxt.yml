emulator: VirtualXT
type: libretro
core_classification: pure_libretro
source: "https://codeberg.org/virtualxt/virtualxt"
upstream: "https://codeberg.org/virtualxt/virtualxt"
profiled_date: "2026-10-17"
source_commit: "a400adb0abf242c2fecbe926618338a00dc557c5"
core_version: "3.1.0"
version_basis:
  kind: file
  path: "virtualxt_libretro.info"
  pattern: '^display_version\s*=\s*"([^"]+)"'
display_name: "VirtualXT"
cores: [virtualxt]
systems: [ibm-pc]

# The BIOS ROMs are compiled in: core.c includes headers generated from
# bios/vxtbios.bin, bios/vxtx.bin and bios/egabios.bin, and hands them to the
# ROM peripherals with vxt_rom_set_data. The core never asks for the system
# directory.
#
# source_ref: src/frontend/core.c:53-61 (embedded headers)
# source_ref: src/frontend/core.c:358-375 (BIOS at 0xFE000, VXTX at 0xFD800)
# source_ref: src/frontend/core.c:438-444 (EGA BIOS when the EGA adapter is chosen)
# source_ref: src/frontend/core.c:1195-1232 (FreeDOS image written to the save directory)
# source_ref: src/modules/rom/rom.c:81-96 (an INI "mem" key loads a ROM from the path it gives)

files: []

notes:
  bios_approach: >
    VXTBIOS, the VXTX disk extension and the EGA BIOS are embedded. A machine
    described by an INI file can load a ROM from a path the INI names, read
    through the frontend VFS as written. With no content the core writes its
    embedded FreeDOS hard disk image to virtualxt_default.img in the save
    directory and boots it.
  supported_extensions: "img, ini, exe, com"
