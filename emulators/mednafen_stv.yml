    source_ref: "libretro/libretro.cpp:639, mednafen/ss/ss.cpp:1442-1443, 1462-1468"
  - name: "stvbios.zip"
    system: "sega-stv"
    category: bios_zip
    required: false
    description: "ST-V BIOS archive"
    source_ref: "mednafen/ss/ss.cpp:1472-1491"
    note: "Read only when the loose BIOS file is missing or not 524288 bytes. The member is found by the BIOS file name, and its size is not checked."
    contents:
      - name: "epr-20091.ic8"
      - name: "epr-19854.ic8"
      - name: "epr-17952a.ic8"
      - name: "epr-17954a.ic8"
