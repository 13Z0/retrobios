notes: |
  The successor of Lindbergh Loader from the same team, in a repository of its
  own, built for Linux and for 32-bit Windows. RetroBat installs the Windows
  release as linuxloader.exe with an ll-deps folder beside it
  (emulatorlauncher Installer.cs:85, emulatorlauncher Program.cs:114) and
  runs it from that folder with -g <game>/disk0[/<launcher>], plus -c, -o and -d for the
  configuration, controls and controller database files it writes there
  (emulatorlauncher Linuxloader.Generator.cs:144-181, 196-213).

  On Linux the launcher puts linuxloader.so in LD_PRELOAD, found in /app/lib32,
  the AppImage lib32, the -L directory, ll-deps, the loader directory, then the
  system 32-bit library folders, and runs the game ELF
  (src/loader/mainShared.c:355-380, 1149-1168). On Windows there is no Linux
  runtime at all. src/loader/elfLoader maps the game ELF itself and resolves
  every DT_NEEDED library through SymbolResolver
  (src/loader/elfLoader/symbolResolver.cpp:249-371). Libraries listed in
  src/loader/elfLoader/elfLoader.cpp:360-401 are answered by a Windows DLL
  (libCg.so by Cg.dll, libCgGL.so by CgGL.dll, libopenal.so.0 and .1 by
  openal32.dll, libz.so.1 by zlib1.dll, libgcc_s.so.1 by libgcc_s_dw2-1.dll)
  or by the loader's own bridges (libc, libpthread, libGL, libasound, X11,
  libsegaapi, libkswapapi and the rest marked INTERNAL). Any other library is
  loaded as a native 32-bit Linux shared object from the search path: the
  executable folder, ll-deps, the -L directory, the game folder, its lib
  subfolder, ../dso/q2satl_lind/release and data/drv/cri/lindbergh/libs
  (symbolResolver.cpp:153-226). A missing libstdc++ ends the run, any other
  missing library is logged and its symbols stay unresolved
  (symbolResolver.cpp:364-371). The Windows release ships these as ll-deps,
  copied from libs/win32/ll-deps plus the MinGW libgcc_s_dw2-1.dll
  (scripts/windows/windows-build.sh:6-7).

  The Lindbergh hardware is emulated in the loader with no firmware file.
  The fopen hooks answer /dev/zero or NUL for the baseboard, EEPROM, serial
  ports and PCI config space (src/loader/redirections/filesystemShared.c:200-280,
  319-420). eeprom.bin is opened from the working directory and created when
  absent (src/loader/hardware/lindbergh/eepromSettings.c:251-256), sram.bin
  defaults to the working directory and is created on first open
  (src/loader/config/config.c:133-134, hardware/lindbergh/baseBoard.c:64-78),
  and card reader files InidCrd%03d.crd or InidCard%02d.crd are written from
  scratch (hardware/lindbergh/cardReader.c:249-253, 386-397). linuxloader.ini
  and controls.ini are optional, each falling back to built-in defaults
  (src/loader/mainShared.c:945-1020).

  Shaders come from the game dump. The Cg 2.0 runtime is loaded only for the
  titles whose patches recompile them: Harley-Davidson, Quiz Answer x Answer,
  Rambo, The House of the Dead EX and Too Spicy
  (src/loader/patching/patch.c:527, 2553, 2587, 2621, 2655, 3090, 3156).
  Primeval Hunt runs through Mesa's Zink driver by default
  (PRIMEVAL_HUNT_USE_ZINK, src/loader/config/config.c:166, 387).

  The boot logos and console fonts are compiled in. resources/lindberghLogo.h
  and resources/font.h carry the same bytes as the Lindbergh Loader
  built-ins (sha1 c800e91a, 9a888a49, 6fcc3fff and e0814d3d). The originals
  are read from the game folder only with DISABLE_BUILTIN_LOGOS or
  DISABLE_BUILTIN_FONT (src/loader/config/config.c:167-168, 372-373).

