    unsourceable: >-
      Pushed from a developer host onto development units. A retail system
      card ships none.
    note: >-
      The fopen hook rewrites /root/lindbergrc to lindbergrc in the game
      folder. The loader neither creates the file nor substitutes for it.
  - name: gamecontrollerdb.txt
