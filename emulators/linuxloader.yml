  # -- Lindbergh boot program --
  - name: segaboot
    system: sega-lindbergh
    required: false
    description: "Sega Lindbergh boot and hardware check program"
    source_ref: "src/loader/mainShared.c:861-864, src/loader/mainShared.c:1170-1172"
    note: >-
      Run as "segaboot -t" under -s or --segaboot, from the game folder. A
      32-bit x86 Linux ELF, /usr/sbin/segaboot on the system CompactFlash card.
      The Windows build creates tmp\segaboot for it (src/loader/mainW.cpp:121-124).

