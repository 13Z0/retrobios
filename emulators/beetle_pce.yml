emulator: Beetle PCE (Mednafen PCE)
type: libretro
core_classification: community_fork
source: "https://github.com/libretro/beetle-pce-libretro"
upstream: "https://mednafen.github.io/"
profiled_date: "2026-03-24"
source_commit: "b96c11e095b6a40a412d2da02766ae1c3f4fd539"
core_version: "v1.29.0"
version_basis:
  kind: file
  path: "libretro.cpp"
  pattern: '#define\s+MEDNAFEN_CORE_VERSION\s+"([^"]+)'
display_name: "NEC - PC Engine / SuperGrafx / CD (Beetle PCE)"
cores: [beetle_pce, mednafen_pce, pce, beetle-pce]
systems: [nec-pc-engine]
verification: existence
notes: >
  Libretro port of Mednafen's PCE module (libretro.cpp:30), with SuperGrafx
  and CD support. The BIOS is loaded from the system directory at CD-ROM
  load time via PCE_LoadCD() in mednafen/pce/pce.cpp:441-460, so HuCard
  content runs without it. Core option "pce_cdbios" selects which card image
  to use (default: System Card 3). DetectGECD() auto-detects Games Express
  discs and switches to the pce.gecdbios setting, fixed to gexpress.pce.
  Arcade Card mode (pce_arcadecard option, enabled by default) extends System
  Card 3 with extra RAM mapping via the SYSCARD_ARCADE enum.
  No hash or size validation on BIOS load: file_open() then HuC_Load() reads
  the data directly.
  DetectSGXCD() reads sector data to decide SGX mode but uses the same BIOS files.

files:
  - name: "syscard3.pce"
    description: "CD-ROM System Card 3.0 (Japan)"
    required: true
    source_ref: "libretro.cpp:1051-1052, mednafen/settings.cpp:40"
    note: "Default value for pce_cdbios option."

  - name: "syscard3u.pce"
    description: "CD-ROM System Card 3.0 (US / TurboGrafx-CD)"
    required: false
    source_ref: "libretro.cpp:1059-1060"
    note: "pce_cdbios = 'System Card 3 US'"

  - name: "syscard2.pce"
    description: "CD-ROM System Card 2.0 (Japan)"
    required: false
    source_ref: "libretro.cpp:1053-1054"
    note: "pce_cdbios = 'System Card 2'"

  - name: "syscard2u.pce"
    description: "CD-ROM System Card 2.0 (US / TurboGrafx-CD)"
    required: false
    source_ref: "libretro.cpp:1061-1062"
    note: "pce_cdbios = 'System Card 2 US'"

  - name: "syscard1.pce"
    description: "CD-ROM System Card 1.0 (Japan)"
    required: false
    source_ref: "libretro.cpp:1055-1056"
    note: "pce_cdbios = 'System Card 1'"

  - name: "gexpress.pce"
    description: "Games Express CD Card"
    required: false
    source_ref: "libretro.cpp:1057-1058, mednafen/settings.cpp:41, mednafen/pce/pce.cpp:374-411"
    note: "pce_cdbios = 'Games Express' or auto-detected via DetectGECD()."
