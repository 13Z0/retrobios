exclusion_note: ".info declares firmware_count=3 but libretro frontend never enables external BIOS loading (UseExtBIOS defaults false in desmume/src/NDSSystem.h:497, never set in libretro.cpp)"

notes: |
  Frozen 2015 snapshot of DeSmuME. The core emulator code supports external
  BIOS/firmware (PrepareBiosARM7/ARM9 in desmume/src/NDSSystem.cpp:1957-2033), but
  UseExtBIOS defaults to false (desmume/src/NDSSystem.h:497) and the libretro frontend
  never sets it: no desmume_use_external_bios core option exists in this
  version. Uses HLE BIOS stubs when external BIOS not loaded.

