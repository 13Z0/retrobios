notes: |
  Libretro port by SundownerSport of Clyde Shaffer's GameTankEmulator. The
  GameTank has no boot ROM: the cartridge image (.gtr) is the whole program,
  loaded from the frontend's buffer (src/libretro.cpp:257-258, 320-361).
  The only files the core opens are its own: a flash cartridge's writes go to
  <rom>.xor in the save directory, read back at load and written at unload
  (src/libretro.cpp:113-154). Nothing is read from the system directory.

