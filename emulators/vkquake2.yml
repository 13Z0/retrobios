notes: |
  Quake II 3.21 with a Vulkan renderer. VERSION 3.21, VKQUAKE2_VERSION
  "1.5.10", BASEDIRNAME = "baseq2" (qcommon/qcommon.h:26-30).

  FS_InitFilesystem reads the basedir cvar, default ".", and mounts
  <basedir>/baseq2 (qcommon/files.c:858, 872). A non-empty game cvar adds
  <basedir>/<game> on top (qcommon/files.c:878-880, 640).
  FS_AddGameDirectory tries pak0.pak through pak9.pak in each directory and
  skips an index that does not open (qcommon/files.c:537-542).

  FS_LoadPackFile computes a checksum of the pak directory, but the
  comparison against PAK0_CHECKSUM only runs with NO_ADDONS, which is
  commented out (qcommon/files.c:24, 28, 484-489). No pak is rejected for
  its contents. The Vulkan renderer, vid_ref default "vk"
  (linux/vid_so.c:448), stops with ERR_FATAL when pics/colormap.pcx is
  missing (ref_vk/vk_image.c:1640-1642). That file is in baseq2/pak0.pak.

  Batocera 43.1 copies /usr/bin/vkquake2 (binary, ref_*.so and the game
  libraries of baseq2, ctf, rogue, smd, xatrix, zaero) into
  /userdata/roms/quake2, changes to that directory and runs ./quake2, with
  `+set game rogue|xatrix|zaero|smd` chosen from the ROM name (configgen
  generators/vkquake2/vkquake2Generator.py). The basedir is therefore
  /userdata/roms/quake2.

  Music is read from <gamedir>/music/trackNN.ogg, .flac, .mp3 or .wav,
  then from baseq2/music/ (client/snd_miniaudio.c:215-220, 241-246).

