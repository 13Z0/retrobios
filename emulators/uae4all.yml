notes: |
  UAE4All2 is Lubomyr's Android and Pandora Amiga emulator. RetroPie builds
  its own branch (retropie) with Makefile.pi, which defines GP2X, PANDORA,
  RASPBERRY and USE_GUICHAN but not ANDROIDSDL (Makefile.pi:31-34, 109). The
  Amiga Forever lookup under com.cloanto.amigaforever.essentials is therefore
  compiled out. AndroidAppSettings.cfg:178 names the version 2.3.6.2.

  The emulator runs from its install directory and takes it as launchDir
  (src/main.cpp:219). Kickstarts are read from launchDir/kickstarts/, which
  RetroPie links to the BIOS directory's amiga/ folder
  (scriptmodules/emulators/uae4all.sh, configure_uae4all).

  The kickstart choice indexes kickstarts_rom_names and extended_rom_names
  (src/memory.cpp:34-35): 0 kick12.rom, 1 kick13.rom, 2 kick20.rom,
  3 kick31.rom, 4 the AROS pair. The default is 1 (src/main.cpp:1). A missing
  file falls back to kick.rom in the working directory (src/main.cpp:95-103).
  The menu refuses to start or reset the machine until the selected file
  exists (src/menu_guichan/menu_guichan.cpp:74-101, 210-214, 489-493), so one
  of the five ROMs has to be present. The AROS pair ships in the source tree
  (AndroidData/aros20140110.zip) and RetroPie unpacks it into the BIOS
  folder, which lets the emulator start without a Commodore ROM.

  read_kickstart (src/memory.cpp:795-830) accepts 8 KB (A1000 bootstrap),
  half the ROM space (mirrored) or the full size. A Kickstart checksum
  mismatch only writes a log line (src/memory.cpp:778-793). No hash is
  checked. A ROM starting with AMIROMTYPE1 is decoded with rom.key
  (src/memory.cpp:732-776).

  The data/ folder (GUI fonts, keyboard and menu images, click.wav) is
  unpacked by RetroPie from AndroidData/data.zip and
  AndroidData/guichan26032014.zip in the source tree. It belongs to the
  program and is not listed.

