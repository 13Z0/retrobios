notes: |
  ZQuest Classic, the continuation of Zelda Classic: a quest player
  (zplayer), an editor (zeditor) and a ZScript compiler. Quests are .qst
  files. RetroBat installs the upstream 2.55.17-windows-x64.zip unchanged
  (its zquestclassic.7z holds the same zplayer.exe and data files byte for
  byte) and launches zplayer.exe with -standalone and the quest, the
  working directory set to the install folder. The profile is pinned to the
  2.55.17 tag.

  Every engine file is opened by a path relative to the working directory.
  At startup the player reads the module file named in zc.cfg, the GUI
  palette, the fonts datafile, sfx.dat, the cursor and the seven built-in
  MIDI tunes, and stops with a fatal error when any of them is missing. The
  title graphics come from modules/classic/title_gfx.dat. The module file
  also names classic_zelda.dat, classic_zquest.dat and a base NSF. The
  player opens none of them: classic_zquest.dat is the editor's datafile
  (src/zq/zquest.cpp:25820), and the release ships no classic_zelda.dat.

  Settings are read from base_config/zc.cfg, then overridden by zc.cfg
  (src/zconfig.cpp:12-74). Both are user configuration.
  modules/classic/default.qst and classic_zquest.dat serve the editor
  (src/qst.cpp:1104-1117, src/zq/zquest.cpp:3255-3323). The quests under
  quests/ and tilesets/ are content.

  Hashes are those of the files in 2.55.17-windows-x64.zip. The text files
  there have CRLF line endings.

