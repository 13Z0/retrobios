emulator: Stella 2014
type: libretro
core_classification: frozen_snapshot
source: "https://github.com/libretro/stella2014-libretro"
upstream: "https://github.com/stella-emu/stella"
profiled_date: "2026-03-25"
source_commit: "7d1361e407e63f29e52892655069e5fb4096e691"
upstream_commit: "289a40f1b63022b8bbe5b722061c660009d5de2c"
core_version: "3.9.3"
version_basis:
  kind: file
  path: "stella/src/common/Version.hxx"
  pattern: '#define\s+STELLA_VERSION\s+"([^"]+)'
display_name: "Atari - 2600 (Stella 2014)"
cores:
  - stella2014
systems:
  - atari_2600

notes: |
  Frozen snapshot of Stella 3.9.3. The Atari 2600 has no BIOS ROM: the TIA,
  RIOT, and 6507 CPU are fully emulated in software. The SuperCharger (Starpath)
  BIOS is emulated via a built-in dummy ROM (ourDummyROMCode in stella/src/emucore/CartAR.cxx:518).
  Game properties database (stella.pro) is compiled into DefProps.hxx, and external
  loading is disabled in the libretro port (stella/src/emucore/PropsSet.cxx:35). The core does not
  call GET_SYSTEM_DIRECTORY. KidVid Voice Module audio tapes (7 WAV files) are
  opened by rfopen with bare filenames, relative to the process working
  directory (stella/src/emucore/KidVid.cxx:166-185), and absence is handled gracefully. EEPROM save data for
  AtariVox and SaveKey peripherals is managed as NVRAM, not user-supplied.

