notes: |
  Solarus engine at tag v2.0.0+cicd1, which RetroBat installs as solarus2
  beside its older solarus package. That tag adds only CI changes to v2.0.0.
  libsolarus.dll in that package reports Solarus 2.0.0 (49d1d46) and its
  gamecontrollerdb.txt is the one this tree carries. emulatorlauncher
  runs `solarus-run.exe -fullscreen=yes|no <rom>` from the package folder on a
  .solarus or .zip quest (emulatorLauncher Generators/Solarus.Generator.cs:20-48).

  The quest arrives as the last non-option argument, and otherwise falls back
  to SOLARUS_DEFAULT_QUEST, "." by default (src/core/MainLoop.cpp:108-121,
  cmake/AddOptions.cmake:8). open_quest mounts that path through PhysFS
  directly, then tries <path>/data, <path>/data.solarus and
  <path>/data.solarus.zip, each both relative and under PHYSFS_getBaseDir
  (src/core/QuestFiles.cpp:151-165). The quest counts as found once quest.dat
  resolves (src/core/QuestFiles.cpp:230-234). Everything else the game uses
  comes out of that mount.

  Startup reads one file from outside the quest. System::initialize probes
  SDL_GetBasePath() then SOLARUS_DATADIR_PATH for gamecontrollerdb.txt and
  hands whichever it finds to SDL through SDL_HINT_GAMECONTROLLERCONFIG_FILE
  (src/core/System.cpp:70-98). At this tag the file is installed into the data
  directory without a build option to turn it off
  (cmake/AddInstallTargets.cmake:22-26).

