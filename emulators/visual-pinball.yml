  - name: hiscore.dat
    system: vpinball
    category: game_data
    required: false
    description: "MAME high score memory map database, read once per machine start"
    source_ref: "pinmame src/hiscore.c:18, 223-230, pinmame src/cpuexec.c:332-334, 393, 1782, src/core/player.cpp:438-440"
    note: >-
      hs_open is called unconditionally at the top of cpu_run for every PinMAME
      machine, and the whole body sits behind `if (f)`, so an absent file is a
      no-op. It resolves to a bare filename against the working directory, which
      the player sets to the table's own folder: libpinmame sets paths for eight
      file types and FILETYPE_HIGHSCORE_DB is not among them, and the option
      table that would supply a default is linked only by the Windows COM build
      (pinmame src/libpinmame/libpinmame.cpp:86-92,1151-1156,
      pinmame src/libpinmame/fileio.c:146, pinmame src/win32com/VPinMAMEConfig.cpp:127).

  - name: cheat.dat
    system: vpinball
    category: game_data
    required: false
    description: "MAME cheat database, read when the PinMAME plugin's Cheat setting is on"
    source_ref: "pinmame src/cheat.c:8434, 8602-8614, pinmame src/mame.c:590-596, pinmame src/libpinmame/libpinmame.cpp:1215-1218, plugins/pinmame/PinMAMEPlugin.cpp:217, 529, plugins/pinmame/Controller.cpp:167"
    note: >-
      Off by default: PinmameSetConfig zeroes options, and the plugin's Cheat
      setting, false unless the user changes it, is handed to PinmameSetCheat
      before each run. With it on, InitCheat loads the database and an
      absent file leaves the menu showing "cheat database not found"
      (pinmame src/cheat.c:2463). Same bare-filename resolution as hiscore.dat.

  - name: fabian-hrir.sofa
    path: "assets/fabian-hrir.sofa"
    system: vpinball
    required: false
    bundled: true
    size: 1766147
    sha1: "5bf46cfb6472b81f4aa7fb2c87bc79afc23109d7"
    md5: "b98b60a050e3c2edfa7a59863c625c61"
    description: "FABIAN full-sphere HRIR set, the HRTF of the binaural spatial audio renderer"
    source_ref: "src/audio/SpatialAudio.cpp:49-56, 344-361, make/CMakeLists_app.txt:656-660"
    note: >-
      Read from assets/ under the installation folder when libspatialaudio is
      built with libmysofa, which every build script does. The headphone and VR
      binauralizer then runs second order ambisonics on it. A missing or
      unreadable file logs "Failed to load the binaural HRTF" and audio falls
      back to loudspeaker decoding. The file sits in src/assets, which the build
      copies beside the binary.

  - name: "plugins/nixie/layouts/"
    type: directory
    path: "plugins/nixie/layouts/"
    system: vpinball
    required: false
    bundled: true
    description: "Nixie default score display layouts, twelve .nix files and the four glass textures they name"
    source_ref: "plugins/nixie/NixiePlugin.cpp:96-110, plugins/nixie/Nixie.cpp:45-65,104-129, make/CMakeLists_plugin_Nixie.txt:92-95"
    note: >-
      Copied from plugins/nixie/layouts in vpinball at e4a79a5. It is the last
      source each Nixie window falls back to, after the table's own .nix and
      the LayoutFolder setting. Every .nix file in the folder is parsed, and
      glass images are read relative to the layout that names them. Without
      the folder the windows get no default layout.

  - name: "plugins/pinmame/memmaps/"
    type: directory
    path: "plugins/pinmame/memmaps/"
    system: vpinball
    required: false
    bundled: true
    description: "NVRAM memory maps, index.json with the maps/ and platforms/ files it names"
    source_ref: "plugins/pinmame/PinMAMEPlugin.cpp:465-472, plugins/pinmame/Controller.cpp:188-246, make/CMakeLists_plugin_PinMAME.txt:115-122, platforms/config.sh:12, platforms/linux-x64/external.sh:252-254, 558-559"
    note: >-
      From tomlogic/pinball-memory-maps at
      68c1b3373ba74cd07f42fba9d56db63ea28212dc, which every platform script
      fetches and copies as index.json, maps/ and platforms/. The plugin falls
      back to this folder when neither the table's pinmame folder nor the
      PinMAMEPath setting holds a memmaps folder. Without one no memory map is
      loaded and the machine still runs.

  - name: "plugins/pinmame/gamedefs/"
    type: directory
    path: "plugins/pinmame/gamedefs/"
    system: vpinball
    required: false
    bundled: true
    description: "PinMAME game definitions, catalog/pinmame.json, the machines/ files it names and the controllers/ files those reference"
    source_ref: "plugins/pinmame/PinMAMEPlugin.cpp:465-472, plugins/pinmame/Controller.cpp:248-288, make/CMakeLists_plugin_PinMAME.txt:115-122, platforms/config.sh:13, platforms/linux-x64/external.sh:256-258, 560-561"
    note: >-
      From vpinball/pinmame-game-defs at
      6eece7e53de9463bf783b9476ce3aeb98e2e7256, which every platform script
      fetches and copies as catalog/, machines/ and controllers/. The plugin
      falls back to this folder the same way as memmaps. Without
      catalog/pinmame.json PinMAME receives an empty game definition and the
      machine still runs.

analysis:
  shipped_with_the_binary:
    note: >-
      Copied into the build output next to the executable and installed as one
      unit by every distribution, so they arrive with the emulator rather than
      being sourced separately.
    source_ref: "make/CMakeLists_app.txt:656-660"
    entries:
      - what: "scripts/, the .vbs library tables include"
        source_ref: "src/core/FileLocator.cpp:400-433, src/core/ScriptGlobalTable.cpp:354-383, src/ui/win/codeview.cpp:2053-2061"
      - what: "assets/, textures, segment display maps, TableSizes.csv, the window icon, the fallback font, the editor icons"
        source_ref: "src/renderer/Renderer.cpp:178-190, src/renderer/Renderer.cpp:1661-1679, src/parts/bumper.cpp:150, 162, src/parts/bumper.cpp:171, src/parts/bumper.cpp:186, src/parts/kicker.cpp:200-241, src/core/TableDB.cpp:16, src/renderer/Window.cpp:280, src/renderer/TextRenderer.cpp:186-187, plugins/pup/PUPManager.cpp:483-485, src/ui/live/editor/EditorChrome.cpp:200"
      - what: "assets/blankTable.vpx, exampleTable.vpx, lightSeqTable.vpx, strippedTable.vpx"
        source_ref: "src/core/AppCommands.cpp:287-293, src/ui/live/EditorUI.cpp:340-359"
        note: "The live editor's default table and its four New Table templates."
      - what: "shaders-10.8.1/, .glfx and .fxh parsed at runtime by the OpenGL renderer"
        source_ref: "src/core/FileLocator.cpp:223, src/renderer/Shader.cpp:1806-1807, src/renderer/Shader.cpp:2210-2213, make/CMakeLists_app.txt:662-672"
      - what: "plugins/<name>/plugin.cfg, the descriptor naming each plugin's library"
        source_ref: "src/core/player.cpp:145, plugins/plugins/MsgPluginManager.cpp:425-436"
      - what: "plugins/flexdmd/assets/, the bitmap fonts UltraDMD names as FlexDMD.Resources.*"
        source_ref: "plugins/flexdmd/UltraDMD.cpp:20-24,32-34, plugins/flexdmd/resources/AssetManager.cpp:103-109,260-280, make/CMakeLists_plugin_FlexDMD.txt:179-182"
      - what: "plugins/nixie/layouts/, the default .nix score display layouts and their glass textures"
        source_ref: "plugins/nixie/NixiePlugin.cpp:96-110, plugins/nixie/Nixie.cpp:45-65,104-129, make/CMakeLists_plugin_Nixie.txt:92-95"
        note: >-
          The last source each of the backglass, score view and topper windows
          falls back to. Every .nix file in the folder is parsed, and a file is
          kept only when it parses completely.
      - what: "plugins/inspector/assets/, the inspector web pages"
        source_ref: "plugins/inspector/InspectorPlugin.cpp:618-626, make/CMakeLists_plugin_Inspector.txt:96"
      - what: "plugins/pinmame/memmaps/ and plugins/pinmame/gamedefs/, the NVRAM memory maps and game definitions"
        source_ref: "make/CMakeLists_plugin_PinMAME.txt:115-122, plugins/pinmame/PinMAMEPlugin.cpp:465-472, platforms/config.sh:12-13, platforms/linux-x64/external.sh:252-258,558-561"
        note: >-
          Copied only when the platform script has fetched them into
          third-party/: index.json, maps/ and platforms/ from
          tomlogic/pinball-memory-maps, catalog/, machines/ and controllers/
          from vpinball/pinmame-game-defs. A table's own pinmame folder or the
          PinMAMEPath setting takes precedence.

  shipped_without_a_reader:
    note: "Copied into the build output but unreachable in the desktop standalone binary"
    entries:
      - what: "docs/Changelog.txt"
        source_ref: "src/ui/win/dialogs/AboutDialog.cpp:34, src/core/stdafx.h:36-40, src/core/AppCommands.cpp:14-18, make/CMakeLists_app.txt:659"
        note: "The About dialog belongs to the Windows editor, compiled out of every standalone build."
      - what: "assets/web/, vpx.html and the files it pulls"
        source_ref: "lib/src/WebServer.cpp:92-99, make/CMakeLists_sources.txt:837-845"
        note: "The web server is compiled into the iOS and Android library build only."

  user_supplied_paths:
    note: "Per table, keyed on the table folder or the ROM name"
    entries:
      - what: "PinMAME ROM sets, <pinmame root>/roms/<romname>.zip"
        source_ref: "plugins/pinmame/PinMAMEPlugin.cpp:437-509, pinmame src/libpinmame/libpinmame.cpp:87,1151-1153"
        note: >-
          One zip per machine. The root is the pinmame folder beside the table
          when it holds roms/, else the PinMAMEPath setting, else $HOME/.pinmame
          on Linux and macOS and <prefpath>/pinmame on iOS and Android.
          Batocera patches the Linux fallback to <prefpath>/pinmame. On Windows
          the last resort is the registered Visual PinMAME install folder, whose
          rompath, nvram, samples, cfg and hiscore registry settings replace
          the default subfolders.
      - what: "PinMAME game aliases, <pinmame root>/alias.txt"
        source_ref: "pinmame src/libpinmame/libpinmame.cpp:362-395,401-404"
        note: "Optional. Each line pairs a requested game name with the ROM set loaded in its place."
      - what: "NVRAM memory maps, memmaps/index.json and the map files it names"
        source_ref: "plugins/pinmame/PinMAMEPlugin.cpp:448, 459-460, 468-469, plugins/pinmame/Controller.cpp:188-246"
        note: >-
          Optional. index.json maps the ROM name to a map file, whose
          _metadata.platform names the platforms/<platform>.json loaded with it.
      - what: "game definitions, gamedefs/catalog/pinmame.json and the definition it names"
        source_ref: "plugins/pinmame/PinMAMEPlugin.cpp:449, 461-462, 470-471, plugins/pinmame/Controller.cpp:248-288"
        note: "Optional. The catalog's drivers array maps the ROM name to a definition file under gamedefs/."
      - what: "backglass, <table basename>.directb2s, else <table folder name>.directb2s"
        source_ref: "plugins/b2s/B2SServer.cpp:317-323,446-463,487-491, plugins/b2s/B2SPlugin.cpp:76"
        note: >-
          Looked up in the table folder, or in the WorkingDir a table script
          sets. Edits made in the plugin's backglass editor are written back to
          the file through a temporary file renamed over it
          (plugins/b2s/B2SServer.cpp:107-109).
      - what: "Serum colorizations, <table folder>/serum/<rom>/<rom>.cROMc or .cRZ, else the SerumPath setting"
        source_ref: "plugins/serum/serum.cpp:51,727-771"
        note: "A namespace folder may sit above the ROM folder, and PinMAME games are also looked up in <table folder>/pinmame/altcolor."
      - what: "VNI colorizations, <table folder>/vni/<rom>/<rom>.pal with an optional .vni, else the VniPath setting"
        source_ref: "plugins/vni/vni.cpp:39,326-376"
        note: "pin2dmd.pal and pin2dmd.vni are accepted in the same folder, and PinMAME games are also looked up in <table folder>/pinmame/altcolor."
      - what: "alternative sound packages, <table folder>/altsound/<rom>, else <table folder>/pinmame/altsound/<rom>, else the plugin's Folder setting"
        source_ref: "plugins/altsound/AltSoundPlugin.cpp:28,114-151"
        note: "The library appends altsound/<rom> to the parent of the folder found, so that folder must be named altsound with this exact case."
      - what: "PUP video packs, <table folder>/pupvideos/<rom>, else pupvideos/ under the PUPFolder setting"
        source_ref: "plugins/pup/PUPManager.cpp:136-164, plugins/pup/PUPPlugin.cpp:66,298-309"
        note: "A namespace folder may sit above the ROM folder."
      - what: "PUP pack sounds, every .wav in PUPSOUNDS/ inside the PUP video pack"
        source_ref: "plugins/pup/PUPSound.cpp:23-66, plugins/pup/PUPManager.cpp:179"
        note: "The pack's PuPSound triggers play these by name. ballroll0.wav to ballroll9.wav loop as ball rolling sounds."
      - what: "Nixie layouts, <table basename>.nix, else <table folder name>.nix, else the LayoutFolder setting"
        source_ref: "plugins/nixie/NixiePlugin.cpp:23,60-113, plugins/nixie/Nixie.cpp:45-65,104-129"
        note: >-
          The setting names one .nix file or a folder of them. Each window walks
          the chain on its own and stops at the first source with a layout
          targeting it. Glass and picture images are read relative to the
          layout file.
      - what: "DOF configuration, <prefpath>/directoutputconfig/GlobalConfig_B2SServer.xml, else ./directoutputconfig/ under the working directory"
        source_ref: "plugins/dof/DOFPlugin.cpp:288-293, libdof src/DOF.cpp:36-45"
        note: "The global configuration names the cabinet and table configuration files libdof reads next."
      - what: "table music, music/ beside the table"
        source_ref: "src/core/ScriptGlobalTable.cpp:120-138, src/core/FileLocator.cpp:267-398"
        note: "An absolute path passed by the script is tried first. In the legacy layout, music/ under the installation folder, then the table folder, then the preferences folder."
      - what: "textbox and decal fonts, <table folder>/<FontName>-<Style>.ttf"
        source_ref: "src/renderer/TextRenderer.cpp:116-155, src/parts/textbox.cpp:603, src/parts/decal.cpp:135"
        note: "A font embedded in the table file is tried next."
      - what: "table sidecars, the .vbs script override, the per-table .ini and the legacy .pov"
        source_ref: "src/parts/pintable.cpp:1507-1523, src/parts/pintable.cpp:1070-1122, src/parts/pintable.h:600-614"
        note: >-
          The .vbs is searched like a script library under the table's name,
          then beside the table under its folder's name. The .ini takes the
          table's name, then its folder's name, a settings profile variant of
          each being tried first. The .pov is imported only when no .ini
          exists, else autopov.pov when present.

  generated_files:
    - what: "VPinballX.ini, the settings file"
      source_ref: "src/core/VPApp.cpp:293-307, src/core/AppCommands.cpp:543-549"
      note: >-
        Looked up in the preferences folder, then beside the binary. When
        neither holds one the preferences path is kept. -Ini names another file.
        Batocera seeds it from the assets/Default_VPinballX.ini its pinned tree
        carries and rewrites it before every launch.
    - what: "VPReg.ini, values saved by table scripts in the table's user folder, and vpinball.log in the preferences folder"
      source_ref: "src/core/ScriptGlobalTable.cpp:529-562, src/utils/Logger.cpp:160-161"
    - what: "<table>.info, the frontend information file beside the table"
      source_ref: "src/parts/pintable.cpp:1125-1136, src/parts/pintable.cpp:1202-1227, src/parts/pintable.h:616-617, src/core/player.cpp:988, src/core/player.cpp:1002"
      note: "Only its VPX section is written, with the run count, the last run date and the play time."
    - what: "PinMAME state: nvram/, cfg/, hi/, inp/, memcard/ and sta/"
      source_ref: "pinmame src/libpinmame/libpinmame.cpp:88,90-91,1154-1156"
      note: "Written by PinMAME as the machine runs."
