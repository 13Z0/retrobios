emulator: "Visual Pinball X"
type: standalone
core_classification: game_engine
source: "https://github.com/vpinball/vpinball"
upstream: "https://github.com/vpinball/vpinball"
profiled_date: "2026-10-23"
source_commit: "639ec097a4b4e2b96455efe80da753606acd245c"
core_version: "10.8.1"
display_name: "Visual Pinball X"
cores:
  - vpinball
  - visual-pinball
systems:
  - vpinball
mode: standalone

notes: |
  Pinball table simulator. The table is the content: .vpx and .vpt files are
  OLE Compound Documents holding the geometry, textures, sounds and a VBScript
  program, read through POLE (src/parts/pintable.cpp:1550-1553), and a .vpz
  pack, a zip or a plain folder of JSON part files, is read through the JSON
  serializer instead (src/parts/pintable.cpp:1459,
  src/utils/JSONSerializer.cpp:1096-1102). Every build other than the Windows
  editor compiles the shared source set with __STANDALONE__ and links
  libwinevbs, Wine's VBScript engine with its COM and ATL headers, beside SDL3,
  SDL3_ttf, FreeImage, hidapi, libspatialaudio and libmysofa with zlib
  (make/CMakeLists_app.txt:558-579,630-640, make/CMakeLists_sources.txt:829-835).
  AlphaDMD, AltSound, B2S, DMDUtil, DOF, FlexDMD, HelloScript, HelloWorld,
  Inspector, Nixie, PinMAME, PUP, RemoteControl, Serum, UpscaleDMD, VNI and WMP
  are plugins staged in plugins/ next to the binary, ../PlugIns on macOS
  (make/CMakeLists_plugins.txt:21-25,39-55). The player scans that folder and
  loads every subfolder whose plugin.cfg names a library for the running
  platform (src/core/player.cpp:145, src/core/FileLocator.cpp:216-222,
  plugins/plugins/MsgPluginManager.cpp:425-436).
  ES-DE finds VPinballX_BGFX or VPinballX_GL and
  runs `<binary> -play <rom>`, Batocera builds the standalone tree at
  3ec37c7f9a into /usr/bin/vpinball and runs `VPinballX_GL -PrefPath <dir> -Ini
  <dir>/VPinballX.ini -Play <rom>`, RetroBat drives the Windows build with its
  registered VPinMAME COM server.

  File location sits in one class. FileLocator holds m_appPath, the
  read-only installation folder, and m_prefPath, the preferences folder that
  -PrefPath overrides, and it works in one of two layout modes: AppPrefData
  splits static data, settings and table files across the three, AppOnly keeps
  everything in the application folder, which is the legacy Windows 9x
  behaviour. Which one applies is decided by where VPinballX.ini is found: in
  the preferences folder gives AppPrefData, else beside the executable gives
  AppOnly, else AppPrefData (src/core/FileLocator.h:11-25,60,66-69,
  src/core/FileLocator.cpp:195-206). The preferences folder is the SDL
  preference path for VPinballX with a major.minor subfolder
  (src/core/FileLocator.cpp:46-53). Batocera's 001-default-path.patch
  redirects the PinMAME root from $HOME/.pinmame to <prefpath>/pinmame.

  Table scripts pull their libraries through SearchScript, which walks ten
  locations in order, each case-insensitively: the table's own folder, then
  user/ and scripts/ beside it, then the installation folder with user/,
  scripts/ and tables/ under it, then the preferences folder with user/ and
  scripts/ under it (src/core/FileLocator.cpp:400-433,
  src/core/ScriptGlobalTable.cpp:354-383). The
  scripts/ directory the build ships carries the 73 .vbs files tables include
  by name, core.vbs and controller.vbs beside the per-manufacturer machine
  scripts (WPC.vbs, sam.vbs, s11.vbs, zac.vbs and the rest), copied from
  src/scripts (make/CMakeLists_app.txt:656-660). The Windows editor's
  completion parser asks for core.vbs through the same search without a table,
  so in the seven installation and preferences locations, and shows a warning
  box when none holds it (src/ui/win/codeview.cpp:2053-2061,
  src/core/FileLocator.cpp:238-245).
  Table scripts also read four directory properties. UserDirectory is the
  table's user folder, created on demand, TablesDirectory the system documents
  folder or the installation folder when SDL reports none, MusicDirectory the
  table's music folder with an optional subfolder, ScriptsDirectory scripts/
  under the installation folder. Each fails when its directory does not exist
  (src/core/ScriptGlobalTable.cpp:385-426, src/core/FileLocator.cpp:251-259).
  In AppPrefData mode user/, music/, cache/<table name>/ and autosave/ sit
  beside the table. A folder missing there on a read is looked up the AppOnly
  way, where user/ hangs off the installation folder, the cache sits under
  Cache/<table name> in the preferences folder and music/ is tried under the
  installation folder, the table folder, then the preferences folder
  (src/core/FileLocator.cpp:267-398).

  The rest of the install tree is read the same way and ships with the binary:
  assets/ holds BallEnv.exr, AODither.webp and EnvMap.webp, the first two
  loaded with no fallback (src/renderer/Renderer.cpp:178-190),
  the bumper and kicker textures (src/parts/bumper.cpp:150,162,171,186,
  src/parts/kicker.cpp:200-241), the segment display textures
  (src/renderer/Renderer.cpp:1661-1679), TableSizes.csv, the table size
  database (src/core/TableDB.cpp:16), vpinball.png for the window icon
  (src/renderer/Window.cpp:280), LiberationSans-Regular.ttf, the font textboxes
  and decals fall back to when neither the table folder, as
  <FontName>-<Style>.ttf, nor the table file carries the font, nor on builds
  with the Windows SDK an installed font matches
  (src/renderer/TextRenderer.cpp:125-198), and which PUP adds after the fonts
  of a pack's FONTS folder (plugins/pup/PUPManager.cpp:479-486),
  fabian-hrir.sofa, listed below, the editor/ part icons
  (src/ui/live/editor/EditorChrome.cpp:200) and four starter tables,
  blankTable.vpx, exampleTable.vpx, lightSeqTable.vpx and strippedTable.vpx:
  the live editor loads blankTable.vpx when started without a table or when
  the requested one fails to load, and its New Table menu loads any of the
  four (src/core/AppCommands.cpp:287-293, src/ui/live/EditorUI.cpp:340-359).
  OpenGL builds also get shaders-10.8.1/, the .glfx and .fxh sources parsed at
  runtime (src/core/FileLocator.cpp:223, src/renderer/Shader.cpp:1806-1807,2210-2213,
  make/CMakeLists_app.txt:662-672), and the directory is not copied for the BGFX
  renderer. Four plugins carry resources of their own: plugins/flexdmd/assets/
  holds the bitmap fonts UltraDMD asks for by resource name, the
  FlexDMD.Resources. prefix being stripped before the lookup
  (plugins/flexdmd/UltraDMD.cpp:20-24,32-34,
  plugins/flexdmd/resources/AssetManager.cpp:103-109,260-280),
  plugins/nixie/layouts/ the default .nix layouts and the glass textures they
  name (plugins/nixie/NixiePlugin.cpp:96-110, plugins/nixie/Nixie.cpp:45-65,104-129),
  plugins/inspector/assets/ the pages of the inspector's web server
  (plugins/inspector/InspectorPlugin.cpp:618-626), and plugins/pinmame/ the
  memmaps/ and gamedefs/ trees the platform scripts fetch from
  tomlogic/pinball-memory-maps at 68c1b33 and vpinball/pinmame-game-defs at
  6eece7e (make/CMakeLists_plugin_PinMAME.txt:115-122, platforms/config.sh:12-13,
  platforms/linux-x64/external.sh:252-258,558-561).

  Two parts of that tree ship without a reader on the desktop targets.
  docs/Changelog.txt is read by the About dialog
  (src/ui/win/dialogs/AboutDialog.cpp:34), which only the Windows editor
  build reaches, the editor being compiled out of every __STANDALONE__ build
  (src/core/stdafx.h:36-40, src/core/AppCommands.cpp:14-18,
  make/CMakeLists_app.txt:78-80), and assets/web/, vpx.html with its scripts
  and style sheets, is served by the web server that only the iOS and Android
  library build compiles (lib/src/WebServer.cpp:92-99,
  make/CMakeLists_sources.txt:837-845, make/CMakeLists_app.txt:702).

  PinMAME is where the emulation happens. Tables that recreate a real solid
  state machine hand a ROM name to the controller, which resolves its root as
  the pinmame folder beside the table when that folder holds roms/, else the
  PinMAMEPath setting, else $HOME/.pinmame on Linux and macOS, <prefpath>/pinmame
  on iOS and Android, and the registered Visual PinMAME install folder with its
  registry folder settings on Windows
  (plugins/pinmame/PinMAMEPlugin.cpp:216,274-294,437-509). libpinmame then hangs
  roms, nvram, samples, cfg, hi, inp, memcard and sta off that root
  (pinmame src/libpinmame/libpinmame.cpp:86-92,1151-1156) and reads alias.txt
  from it, a list that renames a requested game before the driver lookup
  (pinmame src/libpinmame/libpinmame.cpp:362-395,401-404). A memmaps folder,
  beside roms/ in the table's pinmame folder, under the PinMAMEPath setting or
  shipped in the plugin folder, is scanned for an index.json that maps the ROM
  name to an NVRAM memory map, loaded with the platforms/<platform>.json it
  names, and a gamedefs folder found the same way supplies
  catalog/pinmame.json, which maps the driver to a game definition naming the
  machine's inputs and outputs (plugins/pinmame/PinMAMEPlugin.cpp:445-472,
  plugins/pinmame/Controller.cpp:188-288).

  A ROM set is one zip per machine, and every ROM is looked up in the game's
  zip first, then up its parent chain (pinmame src/common.c:1343-1348).
  PinMAME carries neither GAME_IS_BIOS_ROOT nor ROM_SYSTEM_BIOS. What it has
  are nine container sets flagged NOT_A_DRIVER, gts1, gts1s, gts80, gts80s,
  gts80a, gts80as, allied, gp_110 and recel, each the parent of its family's
  games and holding the family's system ROMs. A game declares its system ROMs
  in its own set as well, so they are read from the game zip when it carries
  them and from the container zip otherwise. The Allied Leisure and Game Plan
  110 games declare nothing else. The nine are listed below.

  Two shared data files sit outside that ROM content and are listed below as
  well. Two more that the MAME lineage would suggest are unreachable here. The
  mechanical sample set named by pinmame_sample_names, "*pinmame" followed by
  eighteen .wav members (pinmame src/wpc/wpcsam.c:31-57), is dead twice over:
  readsamples returns before opening anything unless options.use_samples is set
  (pinmame src/common.c:271), the two files that register that option live in
  src/windows/config.c and src/unix/sound.c and neither is in the libpinmame
  source list, and PinmameSetConfig zeroes the whole options struct
  (pinmame src/libpinmame/libpinmame.cpp:1142). Independently, SAMPLESINTERFACE
  is defined in the PinMAME tree (pinmame src/wpc/wpcsam.h:23) and no driver
  references it. history.dat and mameinfo.dat (pinmame src/datafile.c:619-623,
  649-653) are read only by displayhistory, a page of the MAME on-screen menu
  (pinmame src/usrintrf.c:2846-2851), and by the listing path in
  pinmame src/info.c:820 which libpinmame never calls. VPX passes NULL for
  fn_IsKeyPressed, the thirteenth member of PinmameConfig
  (plugins/pinmame/PinMAMEPlugin.cpp:411-427, pinmame src/libpinmame/libpinmame.h:451-467),
  so osd_is_key_pressed always answers 0
  (pinmame src/libpinmame/libpinmame.cpp:577-583) and the menu cannot be opened.

  The pinmame observations were read at 652249e2b98903b94cb8c200dd7024e4776fa0db,
  the revision the build scripts fetch (platforms/config.sh:11), and the libdof
  ones at 4908f45a5bd3b05369885b23f39465d589a32c1f (platforms/config.sh:17).

