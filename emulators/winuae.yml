notes: |
  Amiga emulator for Windows by Toni Wilen. The Kickstart is the file named by
  kickstart_rom_file in the configuration. When it is absent the loader tries
  roms/kick.rom, kick.rom, ../shared/rom/kick.rom and ../System/rom/kick.rom
  under the data path, then guesses from the scanned ROM list
  (memory.cpp:2038-2071). When nothing loads it reports the missing ROM and
  boots the built-in AROS replacement (memory.cpp:3058-3063). Loaded ROMs are
  matched against the ROM table only to name them and check the CPU they need.
  An unknown ROM is still used (memory.cpp:3064-3101).

  RetroBat writes a .uae file per launch with kickstart_rom_file and, for CD32
  and CDTV, kickstart_ext_rom_file. It looks the files up by name in bios/,
  bios/amiga/ and bios/Amiga/, first match wins, and aborts the launch when
  none of the names is found
  (retrobat emulatorLauncher/Generators/Uae.Generator.cs:192-216,1043-1111).
  The Amiga 500 system takes the 2.04 Kickstart instead of 1.3 when its
  a500_machine option is set to amiga500+. It also points KickstartPath at
  bios/ in winuae.ini
  (retrobat emulatorLauncher/Generators/Uae.Generator.cs:155-156). A .uae or
  .ags game file skips this and runs as written.

  For .lha games RetroBat unpacks its own WHDBoot.zip next to the emulator and
  copies the A500, A600, A1200 and A4000 Kickstarts it finds into
  WHDBoot/Devs/Kickstarts for WHDLoad, skipping any that are missing
  (retrobat emulatorLauncher/Generators/Uae.Generator.cs:979-1032).

  CDTV and A600/A1200 internal devices are enabled with :ENABLED, which needs
  no ROM file. Cloanto encrypted ROMs are decoded with rom.key, searched in the
  configured key path, the ROM path, roms/, the data path, ../shared/rom/ and
  next to the Kickstart file (rommgr.cpp:1459-1535). Without it an encrypted
  ROM fails to load (rommgr.cpp:1724-1732).

