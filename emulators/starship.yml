notes: |
  PC port of Star Fox 64 built on the decompilation, by HarbourMasters. The
  game runs from assets extracted out of the user's N64 ROM into sf64.o2r,
  plus the port's own archive starship.o2r, on the libultraship runtime.
  Torch (tools/Torch) performs the extraction inside the executable.

  RetroBat installs the v2.0.0 release: its starship.7z carries the
  Starship.exe, starship.o2r, config.yml and gamecontrollerdb.txt of
  Starship-Barnard-Alfa-Windows.zip byte for byte. The profile is pinned to
  the v2.0.0 tag for that reason. RetroBat's launcher copies the ROM from
  roms/starship into the Starship folder when no other .o2r than
  starship.o2r is there, then starts Starship.exe.

  Startup (GameEngine::GameEngine, src/port/Engine.cpp:65-127):
    1. sf64.o2r next to the executable is loaded when present (:72, :88-89).
    2. Otherwise the user is asked for a ROM. A refusal, a cancelled file
       dialog or a ROM whose SHA-1 is not in mGameList exits (:90-106,
       :272-292). An accepted ROM is extracted by Torch, then the user may
       extract a second ROM for the JP, EU or CN voice archive.
    3. starship.o2r is added when it exists (:109-111).
    4. Every .otr, .o2r and .zip under mods/ is added (:113-126).

  The ROM SHA-1 is computed by Torch over the whole file
  (Torch src/n64/Cartridge.cpp:17, Torch src/Companion.cpp:1535-1537).
  Torch then reads config.yml from the working directory, which maps each
  accepted hash to an asset tree under assets/yaml/ and to an output
  archive: sf64.o2r for the two US revisions, mods/sf64jp.o2r,
  mods/sf64eu.o2r and mods/sf64cn.o2r for the others. A compressed dump is
  first decompressed to the uncompressed image and processed again. Without
  config.yml Torch logs "No config file found" and writes nothing
  (Torch src/Companion.cpp:956-960). config.yml and the 103 assets/yaml
  files ship with the release.

  The renderer loads its default shader from the archives and aborts when
  it is missing
  (libultraship src/graphic/Fast3D/backends/gfx_direct3d11.cpp:1325-1331).
  The shaders are only in starship.o2r, packed from port/ by "torch pack
  port starship.o2r o2r" (CMakeLists.txt:631-635). starship.o2r also
  carries the HUD boost gauge textures.

  Torch and libultraship are submodules of the repository, pinned at v2.0.0
  to f75facb20883570ed091e8ae733ec0539f606e57 and
  45c4f8d6c19c6176f5e0918917c655ea09ecc212. Their citations above are at
  those revisions.

