  - apple-ios

notes: |
  High-level emulator for iPhone OS apps. The operating system and its
  frameworks are reimplemented in Rust, so no Apple firmware or system file is
  opened. What it reads besides the app are resources bundled with it: three
  Free Software ARMv6 libraries, fonts, and a table of default per-app options.
  ref: Cargo.toml:7, src/paths.rs:9-12, src/paths.rs:28-36

  Resources are opened relative to the working directory, or the Resources
  folder of a macOS bundle. ROCKNIX patches the Linux base to /usr/lib/touchHLE.
  ref: src/paths.rs:63-82

  The libraries are mapped into the guest at /usr/lib under their own names and
  aliases. An app binary that links one of them loads it from there, and fails
  to start with "Could not load bundled dylib" when the host file is missing.
  ref: src/fs.rs:588-622, src/environment.rs:384-413

  Fonts are opened the first time an app draws text in that face, and a
  missing or unparsable file is a panic. The Liberation families stand in for
  the iPhone OS faces; Noto Sans JP is used for strings holding kana or kanji.
  ROCKNIX installs only the LiberationSans files, so an app that asks for a
  monospace, serif or Japanese face stops there.
  ref: src/font.rs:70-129, src/frameworks/uikit/ui_font.rs:26-43,
       src/frameworks/uikit/ui_font.rs:180-205

  touchHLE_default_options.txt is read before the user's touchHLE_options.txt;
  when it cannot be opened a warning is printed and the app runs without it.
  ref: src/lib.rs:319-323

