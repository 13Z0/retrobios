notes: |
  Sonic fan game by Sonic Team Junior, built on a modified Doom Legacy
  engine. The pin is tag SRB2_release_2.2.15, the revision RetroPie builds
  (ports/srb2.sh, _version_srb2). The GitHub repository mirrors the
  project's GitLab and carries the same tag commit.

  The game assets are not in the source tree. They ship in the release
  archive SRB2-v2215-Full.zip, which RetroPie unpacks and installs next to
  the binary. The hashes below are those of the files in that archive.

  IdentifyVersion() (src/d_main.c:1126-1205) finds the asset directory
  through I_LocateWad(), which tries SRB2WADDIR, the working directory,
  the default install paths, $HOME/.srb2 and the search paths in that
  order (src/sdl/i_system.c:3019-3072), and chdirs there. The first
  directory holding srb2.pk3 wins. RetroPie launches the binary from its
  install directory. srb2/ below stands for that directory.

  srb2.pk3, zones.pk3 and characters.pk3 are main files: W_InitFile with
  startup set ends in I_Error when one is missing (src/w_wad.c:805-817).
  A build without DEVELOP then checks their MD5 against ASSET_HASH_*
  (src/config.h.in:46-48, src/d_main.c:1447-1449) and W_VerifyFileMD5
  stops on a mismatch (src/w_wad.c:2550-2590). The CMake option
  SRB2_CONFIG_DEV_BUILD, off by default, is what defines DEVELOP
  (src/CMakeLists.txt:149, 383-384). patch.pk3 is loaded only when
  USE_PATCH_DTA is defined, which it is not in this release
  (src/doomdef.h:171).

  music.pk3 is not hashed. MUSICTEST adds it only when it holds music and
  sound lumps alone, rejects it with an error when it holds anything else,
  and skips it when it cannot be opened (src/d_main.c:1189-1203,
  src/w_wad.c:2810, 2840).

