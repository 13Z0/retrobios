    # The primary card is formatted FAT32 (skeleton/BASE/README.txt:15).
    case_insensitive_fs: true
    schedule: null
    target_scraper: null
    target_source: null
    install:
      detect:
      # The release zip holds the build's SYSTEM tree as .system/ at the card
      # root with version.txt, whose first line is the release name
      # (makefile:22-24, 152-157). The installer runs on the computer the
      # card is mounted on and reads it from --dest.
      - os: any
        method: card_marker
        file: .system/version.txt
        first_line_prefix: MinUI-
