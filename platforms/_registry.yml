    # (workspace/all/minarch/minarch.c:2943).
    extract_to: <SD card>/
    logo: https://avatars.githubusercontent.com/u/225589
    scraper: minui
    # minarch hands each core a folder and names no file (workspace/all/minarch/minarch.c:2943):
