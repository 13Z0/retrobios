  # NEC PC-8801 — QUASI88 core
  # QUASI88 searches "quasi88/" subfolder first
  # ref: quasi88-libretro/src/LIBRETRO/libretro.c:463 — snprintf(..., "%s%cquasi88%c%s", ...)
  quasi88:
    # Only what System.dat does not declare for nec-pc-88: the mkII SR
    # extension ROMs that match N88.ROM (MAME pc8801mk2sr: 710a63ec, c0bd2aa6,
    # af2b6efa, 7713c519). The core reads N88EXTn.ROM before n88_n.rom
    # (src/LIBRETRO/libretro.c:109-112), so they win over the n88_n.rom dumps
    # System.dat pairs with that main ROM, which come from other models (n88_0
    # 61984bab is the original PC-8801's). N88SUB.ROM, N88.ROM, N88N.ROM and
    # N88KNJ1.ROM are the native disk.rom, n88.rom, n88n.rom and n88knj1.rom
    # under the other spelling the core tries: aliases in the profile, not
    # files of their own here, or the pack carried disk.rom twice.
    - name: N88EXT0.ROM
      destination: quasi88/N88EXT0.ROM
      required: true
      md5: "d675a2ca186c6efcd6277b835de4c7e5"
    - name: N88EXT1.ROM
      destination: quasi88/N88EXT1.ROM
      required: false
      md5: "e844534dfe5744b381444dbe61ef1b66"
    - name: N88EXT2.ROM
      destination: quasi88/N88EXT2.ROM
      required: false
      md5: "6548fa45061274dee1ea8ae1e9e93910"
    - name: N88EXT3.ROM
      destination: quasi88/N88EXT3.ROM
      required: false
      md5: "fc4b76a402ba501e6ba6de4b3e8b4273"
