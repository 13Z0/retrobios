# Manual target overrides.
# This file is NEVER overwritten by scrapers.
# Use it to add aliases, add/remove cores per target.
#
# Format:
#   platform_name:
#     targets:
#       _default:                    # applies to every target
#         remove_cores: [...]
#       target-name:
#         aliases: [alias1, alias2]
#         add_cores: [core_to_add]
#         remove_cores: [core_to_remove]

# Batocera: the scraper runs Config.in's selects from each board's flags, so
# the Wine-gated emulators (demul, model2emu, xenia) resolve on their own.
# citron and ryujinx stay out: Config.in gates both on
# BATOCERA_CORES_STILL_COMMERCIALIZED, which no board turns on.
batocera:
  targets:
    _default:
      # Amiga machine variants (A500, CD32, etc.) are selectors passed to
      # fsuae/amiberry, not emulators of their own; batocera-es-system
      # groups them under the emulator's node in es_systems.yml.
      # odcommander is OpenDingux's file manager; flatpak/steam/wine-tkg/sh
      # are runtime launchers. N64 video plugins (gliden64, glide64mk2,
      # rice) are backends to mupen64plus, not emulators.
      remove_cores:
        - A500
        - "A500+"
        - A600
        - A1000
        - A1200
        - A3000
        - A4000
        - CD32
        - CDTV
        - flatpak
        - odcommander
        - sh
        - steam
        - wine-tkg
        - gliden64
        - glide64mk2
        - rice
    # Boards are named by SoC; the Raspberry Pi models a user knows map here
    # (Batocera's Config.in comments: "rpi2/rpi3", "rpi4 only", "rpi5 only").
    bcm2835:
      aliases: [rpi1, rpi-zero]
    bcm2836:
      aliases: [rpi2]
    bcm2837:
      aliases: [rpi3, rpi-zero2]
    bcm2711:
      aliases: [rpi4, rpi400, cm4]
    bcm2712:
      aliases: [rpi5, rpi500, cm5]

retrobat:
  targets:
    _default:
      # Launchers and the shell, not emulators.
      remove_cores:
        - flatpak
        - odcommander
        - sh
        - steam
        - wine-tkg
        - glide64mk2
        - gliden64
        - rice

retroarch:
  targets:
    # The buildbot publishes a 6 KB placeholder named "na" on two Android
    # targets. Its retro_get_system_info name is "Not Available": it emulates
    # nothing and no profile can describe it.
    android-armeabi-v7a:
      remove_cores: [na]
    android-x86_64:
      remove_cores: [na]
    nintendo-switch:
      aliases: [switch, nx]
    linux-x86_64:
      aliases: [pc, linux, x86_64, desktop]
    # Raspberry Pi OS 64-bit, ARM single-board computers, Asahi Linux.
    linux-aarch64:
      aliases: [linux-arm64, arm64]
    linux-x86:
      aliases: [linux-i686, i686]
    playstation-ps2:
      aliases: [ps2]
    playstation-psp:
      aliases: [psp]

retrodeck:
  targets:
    _default:
      # RetroDECK ships RetroArch itself as a component; its target list
      # includes the frontend name alongside the actual cores.
      remove_cores: [retroarch]

emudeck:
  targets:
    _default:
      # EmuDeck's EmuScripts tree carries a template.sh placeholder used
      # to scaffold new installers; it is not an emulator.
      remove_cores: [template]

retropie:
  targets:
    _default:
      # Homebrew game scriptmodule, not an emulator.
      remove_cores: [superflappybirds]

rocknix:
  targets:
    _default:
      # Runtimes and launchers the emulators metapackage installs beside the
      # emulators: x86 translation (box64, box86), Windows (wine), the Steam
      # and Heroic clients, and PortMaster, which installs ports.
      remove_cores:
        - box64
        - box86
        - heroic
        - portmaster
        - steam
        - wine
    amd64:
      aliases: [x86_64, pc]

recalbox:
  targets:
    _default:
      # system.ini names a mupen64plus video plugin as the core of the
      # mupen64plus emulator; mupenGenerator.py loads it with --gfx
      # mupen64plus-video-<core>.so. Plugins, not emulators.
      remove_cores:
        - glide64mk2 # mupen64plus-video-glide64mk2
        - gliden64 # GLideN64 video plugin
        - n64_gles2 # mupen64plus-video-gles2n64
        - rice # mupen64plus-video-rice
        - rice_gles2 # mupen64plus-video-gles2rice
    # Recalbox names its boards by defconfig (configs/recalbox-<board>_defconfig).
    rpi3:
      aliases: [rpi3b]
    rpi4_64:
      aliases: [rpi4, rpi400]
    rpi5_64:
      aliases: [rpi5]
    rpizero2:
      aliases: [rpi-zero2]
    x86_64:
      aliases: [pc]
