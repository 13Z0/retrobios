# The boot oracle of scripts/core_probe.py: what a run must reach to boot,
# and what tells a BIOS error apart.
#
# content       per piece of test content (by the sha1 of the file handed to
#               the core, the .cue for a disc), per core (by the library name
#               retro_get_system_info gives): the reference frames a run with
#               the full BIOS set reaches. Each was recorded once
#               (`recorded_from`, the record id) and reviewed by looking at its
#               PNG, from the variant `variant` names when that run was a
#               check. `stage: bios` is a screen only the console's own BIOS
#               draws, `stage: game` a screen of the content. A run that reaches
#               one of them boots.
# error_patterns  log lines after which a core stops, read from its source
#               (`source_ref`). Shared ones at the top level, a core's own under
#               cores:. A line a core logs and then carries on (a fallback to a
#               built-in BIOS) is not an error pattern.
# error_screens per core, the sha1 of a frame that shows its BIOS error message.
# bios_patterns per core, log lines by which it says it loaded the console's
#               own BIOS: they stand for the bios-stage screens of a core
#               that hides them by default.
#
# A run that reaches no reference frame, matches no pattern or screen and
# does not end on one colour is `unknown`: frames that differ from another
# run's never make a boot.

error_patterns: []

cores:
  # The PlayStation cores below log a missing or wrong BIOS and boot a
  # built-in one: none of those lines is an error pattern.
  "Beetle PSX":
    note: >-
      A missing BIOS logs "Firmware is missing" and loads the embedded
      OpenBIOS, a wrong one logs "Firmware found but has invalid SHA1" and is
      loaded anyway (libretro.c:849, 856, 3504-3511 at 7fea57a5).
    fallback_patterns:
      # No name of the region's list and no file of its sha1: the region's
      # setting names the same first file, absent too, and OpenBIOS is mapped.
      - pattern: '^Firmware is missing: '
        source_ref: libretro.c:846-851, 3425-3511 and mednafen/settings.c:121-128 at 7fea57a5
    load_patterns:
      - pattern: '^Firmware found: (?P<path>.+)$'
        source_ref: libretro.c:863-864 at 7fea57a5
      # A file of the wrong sha1 is warned about and loaded all the same.
      - pattern: '^Firmware found but has invalid SHA1: (?P<path>.+)$'
        source_ref: libretro.c:853-861 at 7fea57a5
      - pattern: '^Override firmware found: (?P<path>.+)$'
        source_ref: libretro.c:758-761 at 7fea57a5
      - pattern: '^Override firmware found but has invalid SHA1: (?P<path>.+)$'
        source_ref: libretro.c:748-756 at 7fea57a5
    error_patterns: []
    error_screens:
      - sha1: dfbfc299250c0983f86bbf951efd187441306d92
        shows: the Japanese BIOS main menu, the disc refused (a US disc under a Japanese BIOS)
  "Beetle PSX HW":
    note: The same code as Beetle PSX, built with the hardware renderers.
    fallback_patterns:
      # No name of the region's list and no file of its sha1: the region's
      # setting names the same first file, absent too, and OpenBIOS is mapped.
      - pattern: '^Firmware is missing: '
        source_ref: libretro.c:846-851, 3425-3511 and mednafen/settings.c:121-128 at 7fea57a5
    load_patterns:
      - pattern: '^Firmware found: (?P<path>.+)$'
        source_ref: libretro.c:863-864 at 7fea57a5
      # A file of the wrong sha1 is warned about and loaded all the same.
      - pattern: '^Firmware found but has invalid SHA1: (?P<path>.+)$'
        source_ref: libretro.c:853-861 at 7fea57a5
      - pattern: '^Override firmware found: (?P<path>.+)$'
        source_ref: libretro.c:758-761 at 7fea57a5
      - pattern: '^Override firmware found but has invalid SHA1: (?P<path>.+)$'
        source_ref: libretro.c:748-756 at 7fea57a5
    error_patterns: []
    error_screens:
      - sha1: dfbfc299250c0983f86bbf951efd187441306d92
        shows: the Japanese BIOS main menu, the disc refused (a US disc under a Japanese BIOS)
  "SwanStation":
    note: >-
      "No BIOS image found for <region> region" is followed by the built-in
      OpenBIOS (src/core/host_interface.cpp:182, src/core/system.cpp:678-682
      at 631f0fb3). The file a region option names is loaded without a log
      line, and an unknown image is dropped for OpenBIOS without one either:
      those runs name no BIOS.
    fallback_patterns:
      - pattern: 'No BIOS image found for .* region'
        source_ref: src/core/host_interface.cpp:180-184, src/core/system.cpp:678-682 at 631f0fb3
    load_patterns:
      - pattern: "Using BIOS '(?P<path>[^']+)'"
        source_ref: src/core/host_interface.cpp:165-169 at 631f0fb3
      # The other region's known image, when the console region has none.
      - pattern: "Falling back to possibly-incompatible image '(?P<path>[^']+)'"
        source_ref: src/core/host_interface.cpp:190-193 at 631f0fb3
    error_patterns: []
    error_screens:
      - sha1: 167fb7b6527e295b12dca5806a29856f5f31d401
        shows: the Japanese BIOS main menu, the disc refused (a US disc under a Japanese BIOS)
  "PCSX-ReARMed":
    note: >-
      Without a BIOS, or with one of the wrong size, it logs "Using HLE BIOS"
      and runs its own (frontend/libretro.c:3893-3899 at c8816799). The BIOS
      boot logo is off by default (pcsx_rearmed_show_bios_bootlogo), so its
      runs reach no bios-stage screen: the line it logs once a file passes
      its signature check and is kept stands for them.
    bios_patterns:
      - pattern: '^found (US|EU|JP) BIOS file, crc32 '
        source_ref: frontend/libretro.c:3646-3669 at c8816799
    fallback_patterns:
      - pattern: '^No BIOS files found\.'
        source_ref: frontend/libretro.c:3896-3902 at c8816799
      - pattern: '^Using HLE BIOS\.'
        source_ref: frontend/libretro.c:3889-3894 at c8816799
    load_patterns:
      # Any region's file, the wrong one before HLE (psxmem.c:310).
      - pattern: '^Loaded BIOS "(?P<path>[^"]+)"'
        source_ref: libpcsxcore/psxmem.c:310-328 at c8816799
    error_patterns: []
    error_screens: []
  "Beetle Saturn":
    note: Without a usable BIOS the core logs one of these and retro_load_game fails.
    error_patterns:
      - pattern: '^Cannot open BIOS file '
        source_ref: mednafen/ss/ss.c:1943-1947 at 2ce77e20
      - pattern: '^BIOS file ".*" is of an incorrect size\.'
        source_ref: mednafen/ss/ss.c:1961-1967 at 2ce77e20
      - pattern: '^BIOS file ".*" could not be fully read'
        source_ref: mednafen/ss/ss.c:1978-1983 at 2ce77e20
    error_screens: []
  "pcsx2":
    note: >-
      PCSX2 standalone (scripts/standalone_probe.py). Without a BIOS it shows a
      dialog and runs nothing: the dialog is its error screen, captured as the
      1280x720 root window.
    error_patterns: []
    error_screens:
      - sha1: 46329c633ea7d0b63349261e4aab169e4f44d3f6
        shows: the dialog "PCSX2 requires a PlayStation 2 BIOS in order to run"
  "Flycast":
    note: >-
      Dreamcast: without dc_boot.bin (or bios.bin) under dc/ it runs the reios
      HLE BIOS. Read from the source, not yet seen in a run's log.
    fallback_patterns:
      - pattern: 'Did not load BIOS, using reios'
        source_ref: core/emulator.cpp:614-619 at e88b0ced
    load_patterns:
      - pattern: 'Loaded (?P<path>.+) as bootrom'
        source_ref: core/hw/flashrom/flashrom.cpp:56-64, core/hw/flashrom/nvmem.cpp:298-309 at e88b0ced
    error_patterns: []
    error_screens: []
  "PCSX1":
    note: An HLE BIOS stands in when none is found, and the run logs nothing about it.
    error_patterns: []
    error_screens: []

