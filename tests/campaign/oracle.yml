# The boot oracle of scripts/core_probe.py: what a run must reach to boot,
# and what tells a BIOS error apart.
#
# content       per piece of test content (by the sha1 of the file handed to
#               the core, the .cue for a disc), per core (by the library name
#               retro_get_system_info gives): the reference frames a run with
#               the full BIOS set reaches. Each was recorded once
#               (`recorded_from`, the record id) and reviewed by looking at its
#               PNG. `stage: bios` is a screen only the console's own BIOS
#               draws, `stage: game` a screen of the content. A run that reaches
#               one of them boots.
# error_patterns  log lines after which a core stops, read from its source
#               (`source_ref`). Shared ones at the top level, a core's own under
#               cores:. A line a core logs and then carries on (a fallback to a
#               built-in BIOS) is not an error pattern.
# error_screens per core, the sha1 of a frame that shows its BIOS error message.
# bios_patterns per core, log lines by which it says it loaded the console's
#               own BIOS: they stand for the bios-stage screens of a core
#               that hides them by default.
#
# A run that reaches no reference frame, matches no pattern or screen and
# does not end on one colour is `unknown`: frames that differ from another
# run's never make a boot.

error_patterns: []

cores:
  # The PlayStation cores below log a missing or wrong BIOS and boot a
  # built-in one: none of those lines is an error pattern.
  "Beetle PSX":
    note: >-
      A missing BIOS logs "Firmware is missing" and loads the embedded
      OpenBIOS, a wrong one logs "Firmware found but has invalid SHA1" and is
      loaded anyway (libretro.c:849, 856, 3504-3511 at 7fea57a5).
    error_patterns: []
    error_screens: []
  "Beetle PSX HW":
    note: The same code as Beetle PSX, built with the hardware renderers.
    error_patterns: []
    error_screens: []
  "SwanStation":
    note: >-
      "No BIOS image found for <region> region" is followed by the built-in
      OpenBIOS (src/core/host_interface.cpp:182, src/core/system.cpp:678-682
      at 631f0fb3).
    error_patterns: []
    error_screens: []
  "PCSX-ReARMed":
    note: >-
      Without a BIOS, or with one of the wrong size, it logs "Using HLE BIOS"
      and runs its own (frontend/libretro.c:3893-3899 at c8816799). The BIOS
      boot logo is off by default (pcsx_rearmed_show_bios_bootlogo), so its
      runs reach no bios-stage screen: the line it logs once a file passes
      its signature check and is kept stands for them.
    bios_patterns:
      - pattern: '^found (US|EU|JP) BIOS file, crc32 '
        source_ref: frontend/libretro.c:3646-3669 at c8816799
    error_patterns: []
    error_screens: []
  "Beetle Saturn":
    note: Without a usable BIOS the core logs one of these and retro_load_game fails.
    error_patterns:
      - pattern: '^Cannot open BIOS file '
        source_ref: mednafen/ss/ss.c:1943-1947 at 2ce77e20
      - pattern: '^BIOS file ".*" is of an incorrect size\.'
        source_ref: mednafen/ss/ss.c:1961-1967 at 2ce77e20
      - pattern: '^BIOS file ".*" could not be fully read'
        source_ref: mednafen/ss/ss.c:1978-1983 at 2ce77e20
    error_screens: []
  "PCSX1":
    note: An HLE BIOS stands in when none is found, and the run logs nothing about it.
    error_patterns: []
    error_screens: []

